<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Fusos Horários</title>
    <style>
        /* Estilo da Página Principal */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121214;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        .btn-principal {
            background-color: #4ea8de;
            color: #121214;
            border: none;
            padding: 15px 35px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(78, 168, 222, 0.3);
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn-principal:hover {
            background-color: #3a8dbd;
            transform: scale(1.02);
        }

        /* Fundo escurecido do Pop-up Virtual */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.75);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 9999;
        }

        /* Estrutura do Pop-up com Proporção Exata 12x3 (1200x300) */
        .modal-box {
            width: 1200px;
            height: 300px;
            background-color: #1a1a1e;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #3a3a42;
            padding: 15px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }

        /* Quando o pop-up estiver ativo */
        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-overlay.active .modal-box {
            transform: scale(1);
        }

        /* Botão para Fechar o Pop-up */
        .close-btn {
            position: absolute;
            top: 12px;
            right: 15px;
            background: #ff5f56;
            border: none;
            color: white;
            font-weight: bold;
            border-radius: 50%;
            width: 22px;
            height: 22px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
        }

        /* Elementos Internos da Régua */
        .top-bar {
            display: flex;
            justify-content: flex-start;
            margin-bottom: 5px;
        }
        .selectors { display: flex; gap: 15px; }
        select {
            background-color: #333339;
            color: white;
            border: 1px solid #555;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 0.85rem;
            cursor: pointer;
            outline: none;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: #26262b;
        }
        th, td {
            border: 1px solid #3a3a42;
            text-align: center;
            padding: 8px 2px;
            font-size: 0.85rem;
        }
        th { background-color: #1f1f23; font-weight: 600; }
        .city-header {
            text-align: left;
            padding-left: 12px;
            width: 180px;
            font-weight: bold;
            background-color: #18181c;
        }
        
        /* Legenda na Base */
        .legend { 
            display: flex; 
            gap: 20px; 
            font-size: 0.8rem; 
            background: #26262b;
            padding: 6px 15px;
            border-radius: 6px;
            justify-content: center;
        }
        .legend-item { display: flex; align-items: center; gap: 6px; }
        .color-box { width: 14px; height: 14px; border-radius: 3px; }

        /* Cores das Fases baseadas na foto */
        .p-amanhecer { background-color: #d4a373; color: #000; font-weight: bold; }
        .p-manha     { background-color: #64b5f6; color: #000; font-weight: bold; }
        .p-dia       { background-color: #e9c46a; color: #000; font-weight: bold; }
        .p-anoitecer { background-color: #f4a261; color: #000; font-weight: bold; }
        .p-noite     { background-color: #1d3557; color: #fff; }
    </style>
</head>
<body>

    <button class="btn-principal" onclick="toggleModal(true)">Abrir Tabela de Fusos (12x3)</button>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box">
            <button class="close-btn" onclick="toggleModal(false)">X</button>
            
            <div class="top-bar">
                <div class="selectors">
                    <select id="sel-0" onchange="alterarFuso(0, this.value)"></select>
                    <select id="sel-1" onchange="alterarFuso(1, this.value)"></select>
                    <select id="sel-2" onchange="alterarFuso(2, this.value)"></select>
                </div>
            </div>

            <table>
                <thead><tr id="header-row"><th class="city-header">Cidade / Fuso Base</th></tr></thead>
                <tbody id="table-body"></tbody>
            </table>

            <div class="legend">
                <div class="legend-item"><div class="color-box p-amanhecer"></div> Amanhecer (05h-06h)</div>
                <div class="legend-item"><div class="color-box p-manha"></div> Manhã (07h-11h)</div>
                <div class="legend-item"><div class="color-box p-dia"></div> Dia (12h-16h)</div>
                <div class="legend-item"><div class="color-box p-anoitecer"></div> Anoitecer (17h-18h)</div>
                <div class="legend-item"><div class="color-box p-noite"></div> Noite / Madrugada (19h-04h)</div>
            </div>
        </div>
    </div>

    <script>
        // Banco de dados local estático
        const cidadesDados = [
            { offset: -12, name: "Baker Island (UTC -12)" },
            { offset: -11, name: "Samoa Americana (UTC -11)" },
            { offset: -10, name: "Honolulu (UTC -10)" },
            { offset: -9, name: "Alasca (UTC -9)" },
            { offset: -8, name: "Los Angeles (UTC -8)" },
            { offset: -7, name: "Denver (UTC -7)" },
            { offset: -6, name: "Cidade do México (UTC -6)" },
            { offset: -5, name: "Washington D.C. (UTC -5)" },
            { offset: -4, name: "Manaus / Santiago (UTC -4)" },
            { offset: -3, name: "Brasília / São Paulo (UTC -3)" },
            { offset: -2, name: "Fernando Noronha (UTC -2)" },
            { offset: -1, name: "Açores / Cabo Verde (UTC -1)" },
            { offset: 0, name: "Londres / GMT (UTC 0)" },
            { offset: 1, name: "Paris / Berlim (UTC +1)" },
            { offset: 2, name: "Tel Aviv / Cairo (UTC +2)" },
            { offset: 3, name: "Moscou / Nairóbi (UTC +3)" },
            { offset: 4, name: "Dubai / Baku (UTC +4)" },
            { offset: 5, name: "Carachi / Maldivas (UTC +5)" },
            { offset: 6, name: "Dhaka / Astana (UTC +6)" },
            { offset: 7, name: "Bangcoc / Jacarta (UTC +7)" },
            { offset: 8, name: "Pequim / Cingapura (UTC +8)" },
            { offset: 9, name: "Hanseong / Tóquio (UTC +9)" },
            { offset: 10, name: "Sydney / Melbourne (UTC +10)" },
            { offset: 11, name: "Ilhas Salomão (UTC +11)" },
            { offset: 12, name: "Auckland / Fiji (UTC +12)" },
            { offset: 13, name: "Tonga / Samoa (UTC +13)" },
            { offset: 14, name: "Quiribáti (UTC +14)" }
        ];

        let cidadesAtivas = [-5, 2, 9]; 

        // Controle do Pop-up Virtual
        function toggleModal(open) {
            const overlay = document.getElementById('modalOverlay');
            if (open) overlay.classList.add('active');
            else overlay.classList.remove('active');
        }

        function obterClassePeriodo(hora) {
            if (hora >= 5 && hora <= 6) return 'p-amanhecer';
            if (hora >= 7 && hora <= 11) return 'p-manha';
            if (hora >= 12 && hora <= 16) return 'p-dia';
            if (hora >= 17 && hora <= 18) return 'p-anoitecer';
            return 'p-noite'; 
        }

        function inicializarSeletores() {
            for (let i = 0; i < 3; i++) {
                const select = document.getElementById(`sel-${i}`);
                cidadesDados.forEach(cidade => {
                    const opt = document.createElement('option');
                    opt.value = cidade.offset;
                    opt.textContent = cidade.name;
                    if (cidade.offset === cidadesAtivas[i]) opt.selected = true;
                    select.appendChild(opt);
                });
            }
        }

        function alterarFuso(index, offsetValue) {
            cidadesAtivas[index] = parseInt(offsetValue);
            renderizarRegua();
        }

        function renderizarRegua() {
            const headerRow = document.getElementById('header-row');
            const tbody = document.getElementById('table-body');
            
            headerRow.innerHTML = '<th class="city-header">Cidade / Fuso Base</th>';
            tbody.innerHTML = '';

            const fusoReferencia = cidadesAtivas[0];

            for (let i = 0; i < 24; i++) {
                const th = document.createElement('th');
                th.textContent = i.toString().padStart(2, '0');
                headerRow.appendChild(th);
            }

            cidadesAtivas.forEach(fusoAtual => {
                const tr = document.createElement('tr');
                const dadosCidade = cidadesDados.find(c => c.offset === fusoAtual);
                
                const tdNome = document.createElement('td');
                tdNome.className = 'city-header';
                tdNome.innerHTML = `<strong>${dadosCidade.name.split(' (')[0]}</strong>`;
                tr.appendChild(tdNome);

                for (let i = 0; i < 24; i++) {
                    const diferenca = fusoAtual - fusoReferencia;
                    let horaCalculada = (i + diferenca) % 24;
                    if (horaCalculada < 0) horaCalculada += 24; 

                    const tdHora = document.createElement('td');
                    tdHora.textContent = horaCalculada.toString().padStart(2, '0');
                    tdHora.className = obterClassePeriodo(horaCalculada);
                    tr.appendChild(tdHora);
                }
                tbody.appendChild(tr);
            });
        }

        inicializarSeletores();
        renderizarRegua();
    </script>
</body>
</html>
