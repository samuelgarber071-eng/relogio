<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interface Tablet 9"</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        /* Container otimizado para telas de tablet de 9 polegadas (~1024x600 px) */
        .tablet-screen {
            width: 100%;
            max-width: 1024px;
            height: 600px;
            background: #1e293b;
            border-radius: 16px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #334155;
        }

        /* Header sem o relógio UTC */
        .header {
            height: 56px;
            background-color: #0f172a;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            border-bottom: 1px solid #334155;
        }

        .header .title {
            font-size: 1.15rem;
            font-weight: 600;
            color: #38bdf8;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header .status-badges {
            display: flex;
            gap: 10px;
        }

        .badge {
            background: #1e293b;
            padding: 5px 10px;
            border-radius: 16px;
            font-size: 0.8rem;
            color: #94a3b8;
            border: 1px solid #334155;
        }

        .badge.online {
            color: #4ade80;
            border-color: rgba(74, 222, 128, 0.2);
        }

        /* Layout Principal do Tablet */
        .main-content {
            display: grid;
            grid-template-columns: 220px 1fr;
            flex: 1;
            height: calc(100% - 56px);
        }

        /* Menu Lateral */
        .sidebar {
            background-color: #0f172a;
            border-right: 1px solid #334155;
            padding: 16px 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .nav-item {
            padding: 10px 14px;
            border-radius: 8px;
            color: #94a3b8;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-item.active, .nav-item:hover {
            background: #1e293b;
            color: #38bdf8;
        }

        /* Área do Dashboard */
        .content-area {
            padding: 20px;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            align-content: start;
        }

        .card {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 16px;
        }

        .card-header {
            font-size: 0.8rem;
            color: #94a3b8;
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .card-value {
            font-size: 1.6rem;
            font-weight: 700;
            color: #f8fafc;
        }

        .card-full {
            grid-column: span 2;
        }
    </style>
</head>
<body>

    <div class="tablet-screen">
        <!-- Cabeçalho (Sem relógio UTC) -->
        <div class="header">
            <div class="title">
                <span>⚡ Painel de Controle</span>
            </div>
            <div class="status-badges">
                <span class="badge online">● Conectado</span>
                <span class="badge">Tablet 9"</span>
            </div>
        </div>

        <div class="main-content">
            <!-- Barra Lateral de Navegação -->
            <div class="sidebar">
                <a href="#" class="nav-item active">📊 Visão Geral</a>
                <a href="#" class="nav-item">⚙️ Configurações</a>
                <a href="#" class="nav-item">📈 Relatórios</a>
            </div>

            <!-- Área de Conteúdo -->
            <div class="content-area">
                <div class="card">
                    <div class="card-header">Desempenho</div>
                    <div class="card-value">98.4%</div>
                </div>

                <div class="card">
                    <div class="card-header">Sessões Ativas</div>
                    <div class="card-value">1,248</div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
