<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Fusos Horários e Distâncias - Capitais do Mundo</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121214;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        .btn-principal {
            background-color: #4ea8de;
            color: #121214;
            border: none;
            padding: 15px 35px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(78, 168, 222, 0.3);
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn-principal:hover {
            background-color: #3a8dbd;
            transform: scale(1.02);
        }

        /* Fundo escurecido do Pop-up */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 9999;
        }

        /* Estrutura do Pop-up */
        .modal-box {
            width: 1200px;
            max-width: 95vw;
            background-color: #1a1a1e;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            border: 1px solid #3a3a42;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 15px;
            position: relative;
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-overlay.active .modal-box {
            transform: scale(1);
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 12px;
            background: #ff5f56;
            border: none;
            color: white;
            font-weight: bold;
            border-radius: 50%;
            width: 22px;
            height: 22px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
        }

        .top-bar {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .selectors-title {
            font-size: 0.85rem;
            color: #aaa;
            margin-bottom: 2px;
        }

        .selectors { display: flex; gap: 15px; flex-wrap: wrap; }
        
        select {
            background-color: #333339;
            color: white;
            border: 1px solid #555;
            padding: 6px 10px;
            border-radius: 5px;
            font-size: 0.82rem;
            cursor: pointer;
            outline: none;
            flex: 1;
            min-width: 200px;
        }

        /* Calculadora Haversine */
        .haversine-section {
            background-color: #222227;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #333;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            flex-wrap: wrap;
        }

        .haversine-inputs {
            display: flex;
            gap: 10px;
            align-items: center;
            flex: 1;
        }

        .haversine-result {
            font-size: 0.9rem;
            font-weight: bold;
            color: #4ea8de;
            background: #18181c;
            padding: 8px 15px;
            border-radius: 5px;
            border: 1px solid #3a3a42;
            white-space: nowrap;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: #26262b;
        }
        th, td {
            border: 1px solid #3a3a42;
            text-align: center;
            padding: 7px 2px;
            font-size: 0.8rem;
        }
        th { background-color: #1f1f23; font-weight: 600; }
        .city-header {
            text-align: left;
            padding-left: 8px;
            width: 220px;
            font-weight: bold;
            background-color: #18181c;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        /* Legenda */
        .legend { 
            display: flex; 
            gap: 20px; 
            font-size: 0.78rem; 
            background: #26262b;
            padding: 6px 15px;
            border-radius: 6px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .legend-item { display: flex; align-items: center; gap: 6px; }
        .color-box { width: 12px; height: 12px; border-radius: 3px; }

        /* Cores */
        .p-amanhecer { background-color: #d4a373; color: #000; font-weight: bold; }
        .p-manha     { background-color: #64b5f6; color: #000; font-weight: bold; }
        .p-dia       { background-color: #e9c46a; color: #000; font-weight: bold; }
        .p-anoitecer { background-color: #f4a261; color: #000; font-weight: bold; }
        .p-noite     { background-color: #1d3557; color: #fff; }
    </style>
</head>

    <button class="btn-principal" onclick="toggleModal(true)">Abrir Painel das Capitais</button>

    <div class="modal-overlay" id="modalOverlay">

                    <select id="sel-2" onchange="alterarFuso(2, this.value)"></select>
                </div>
            </div>

            <!-- Calculadora de Distância (Haversine) -->
            <div class="haversine-section">
                <div class="haversine-inputs">
                    <span style="font-size: 0.85rem; font-weight: bold; color: #ccc;">📏 Calculadora de Distância:</span>
                    <select id="hav-origem" onchange="calcularHaversine()"></select>
                    <span style="font-size: 0.85rem;">➔</span>
                    <select id="hav-destino" onchange="calcularHaversine()"></select>
                </div>
                <div class="haversine-result" id="haversine-output">
                    Distância: - km
                </div>
            </div>

            <table>
                <thead><tr id="header-row"><th class="city-header">Capital / Fuso Base</th></tr></thead>
                <tbody id="table-body"></tbody>
            </table>

            <div class="legend">

            </div>
        </div>
    </div>

            { name: "Tóquio (Japão)", offset: 9, lat: 35.6762, lng: 139.6503 },
            { name: "Trípoli (Líbia)", offset: 2, lat: 32.8872, lng: 13.1913 },
            { name: "Túnis (Tunísia)", offset: 1, lat: 36.8065, lng: 10.1815 },
            { name: "Ulaanbaatar (Mongólia)", offset: 8, lat: 47.8864, lng: 106.9057 },
            { name: "Valeta (Malta)", offset: 1, lat: 35.8997, lng: 14.5148 },
            { name: "Varsóvia (Polônia)", offset: 1, lat: 52.2297, lng: 21.0122 },
            { name: "Viena (Áustria)", offset: 1, lat: 48.2082, lng: 16.3738 },
            { name: "Vientiane (Laos)", offset: 7, lat: 17.9757, lng: 102.6331 },
            { name: "Vilnius (Lituânia)", offset: 2, lat: 54.6872, lng: 25.2798 },
            { name: "Washington, D.C. (Estados Unidos)", offset: -5, lat: 38.9072, lng: -77.0369 },
            { name: "Wellington (Nova Zelândia)", offset: 12, lat: -41.2865, lng: 174.7762 },
            { name: "Iamussucro (Costa do Marfim)", offset: 0, lat: 6.8276, lng: -5.2767 },
            { name: "Ierevan (Armênia)", offset: 4, lat: 40.1792, lng: 44.4991 },
            { name: "Iaundé (Camarões)", offset: 1, lat: 3.8480, lng: 11.5021 },
            { name: "Zagreb (Croácia)", offset: 1, lat: 45.8150, lng: 15.9819 }
        ];

        let indicesAtivos = [
            capitaisMundo.findIndex(c => c.name.startsWith("Brasília")),
            capitaisMundo.findIndex(c => c.name.startsWith("Lisboa")),
            capitaisMundo.findIndex(c => c.name.startsWith("Tóquio"))
        ];

        function toggleModal(open) {
            const overlay = document.getElementById('modalOverlay');
            if (open) overlay.classList.add('active');
            else overlay.classList.remove('active');
        }

        function obterClassePeriodo(hora) {
            if (hora >= 5 && hora <= 6) return 'p-amanhecer';
            if (hora >= 7 && hora <= 11) return 'p-manha';
            if (hora >= 12 && hora <= 16) return 'p-dia';
            if (hora >= 17 && hora <= 18) return 'p-anoitecer';
            return 'p-noite'; 
        }

        function inicializarSeletores() {
            for (let i = 0; i < 3; i++) {
                const select = document.getElementById(`sel-${i}`);
                select.innerHTML = '';
                capitaisMundo.forEach((capital, index) => {
                    const opt = document.createElement('option');
                    opt.value = index;
                    const fusoStr = capital.offset >= 0 ? `+${capital.offset}` : capital.offset;
                    opt.textContent = `${capital.name} (UTC ${fusoStr})`;
                    if (index === indicesAtivos[i]) opt.selected = true;
                    select.appendChild(opt);
                });
            }

            // Popula os seletores da calculadora Haversine
            const havOrigem = document.getElementById('hav-origem');
            const havDestino = document.getElementById('hav-destino');
            havOrigem.innerHTML = '';
            havDestino.innerHTML = '';

            capitaisMundo.forEach((capital, index) => {
                const opt1 = document.createElement('option');
                opt1.value = index;
                opt1.textContent = capital.name;
                
                const opt2 = opt1.cloneNode(true);
                
                if (index === indicesAtivos[0]) opt1.selected = true; // Brasília
                if (index === indicesAtivos[1]) opt2.selected = true; // Lisboa

                havOrigem.appendChild(opt1);
                havDestino.appendChild(opt2);
            });

            calcularHaversine();
        }

        function alterarFuso(seletorIdx, capitalIndex) {
            indicesAtivos[seletorIdx] = parseInt(capitalIndex, 10);
            renderizarRegua();
        }

        function renderizarRegua() {
            const headerRow = document.getElementById('header-row');
            const tbody = document.getElementById('table-body');
            
            headerRow.innerHTML = '<th class="city-header">Capital Base</th>';
            tbody.innerHTML = '';

            const capitalReferencia = capitaisMundo[indicesAtivos[0]];
            const fusoReferencia = capitalReferencia.offset;

            for (let i = 0; i < 24; i++) {
                const th = document.createElement('th');
                th.textContent = i.toString().padStart(2, '0');
                headerRow.appendChild(th);
            }

            indicesAtivos.forEach((capIdx) => {
                const capitalAtual = capitaisMundo[capIdx];
                const fusoAtual = capitalAtual.offset;
                
                const tr = document.createElement('tr');
                const tdNome = document.createElement('td');
                tdNome.className = 'city-header';
                tdNome.innerHTML = `<strong>${capitalAtual.name.split(' (')[0]}</strong>`;
                tr.appendChild(tdNome);

                for (let i = 0; i < 24; i++) {
                    const diferenca = fusoAtual - fusoReferencia;
                    let horaCalculada = (i + diferenca) % 24;
                    if (horaCalculada < 0) horaCalculada += 24; 

                    const horaInteira = Math.floor(horaCalculada);
                    const minutos = Math.round((horaCalculada - horaInteira) * 60);
                    
                    const tdHora = document.createElement('td');
                    tdHora.textContent = minutos > 0 
                        ? `${horaInteira.toString().padStart(2, '0')}:${minutos.toString().padStart(2, '0')}`
                        : horaInteira.toString().padStart(2, '0');

                    tdHora.className = obterClassePeriodo(horaInteira);
                    tr.appendChild(tdHora);
                }
                tbody.appendChild(tr);
            });
        }

        // --- CALCULADORA DE HAVERSINE ---
        function calcularHaversine() {
            const idxOrigem = document.getElementById('hav-origem').value;
            const idxDestino = document.getElementById('hav-destino').value;

            const c1 = capitaisMundo[idxOrigem];
            const c2 = capitaisMundo[idxDestino];

            const R = 6371; // Raio médio da Terra em quilômetros
            const dLat = toRad(c2.lat - c1.lat);
            const dLng = toRad(c2.lng - c1.lng);

            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                      Math.cos(toRad(c1.lat)) * Math.cos(toRad(c2.lat)) *
                      Math.sin(dLng / 2) * Math.sin(dLng / 2);

            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            const distanciaKm = R * c;
            const distanciaMilhas = distanciaKm * 0.621371;

            const output = document.getElementById('haversine-output');
            output.innerHTML = `Distância: <strong>${distanciaKm.toLocaleString('pt-BR', { maximumFractionDigits: 1 })} km</strong> (${distanciaMilhas.toLocaleString('pt-BR', { maximumFractionDigits: 1 })} mi)`;
        }

        function toRad(valorGraus) {
            return (valorGraus * Math.PI) / 180;
        }

        inicializarSeletores();
        renderizarRegua();
    </script>
