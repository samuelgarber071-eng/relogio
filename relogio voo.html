<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Fusos Horários e Calculadora de Voo</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121214;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .btn-principal {
            background-color: #4ea8de;
            color: #121214;
            border: none;
            padding: 15px 35px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(78, 168, 222, 0.3);
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn-principal:hover {
            background-color: #3a8dbd;
            transform: scale(1.02);
        }

        /* Fundo escurecido do Pop-up Virtual */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 9999;
        }

        /* Estrutura do Pop-up */
        .modal-box {
            width: 1200px;
            max-width: 95vw;
            background-color: #1a1a1e;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            border: 1px solid #3a3a42;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 15px;
            position: relative;
            transform: scale(0.9);
            transition: transform 0.3s ease;
            max-height: 95vh;
            overflow-y: auto;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-overlay.active .modal-box {
            transform: scale(1);
        }

        .close-btn {
            position: absolute;
            top: 12px;
            right: 15px;
            background: #ff5f56;
            border: none;
            color: white;
            font-weight: bold;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
        }

        /* Seletores da Tabela */
        .top-bar {
            display: flex;
            justify-content: flex-start;
        }
        .selectors { display: flex; gap: 15px; flex-wrap: wrap; }
        select {
            background-color: #333339;
            color: white;
            border: 1px solid #555;
            padding: 6px 12px;
            border-radius: 5px;
            font-size: 0.85rem;
            cursor: pointer;
            outline: none;
            max-width: 320px;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: #26262b;
        }
        th, td {
            border: 1px solid #3a3a42;
            text-align: center;
            padding: 7px 2px;
            font-size: 0.8rem;
        }
        th { background-color: #1f1f23; font-weight: 600; }
        .city-header {
            text-align: left;
            padding-left: 8px;
            width: 220px;
            font-weight: bold;
            background-color: #18181c;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        /* Legenda */
        .legend { 
            display: flex; 
            gap: 20px; 
            font-size: 0.78rem; 
            background: #26262b;
            padding: 6px 15px;
            border-radius: 6px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .legend-item { display: flex; align-items: center; gap: 6px; }
        .color-box { width: 12px; height: 12px; border-radius: 3px; }

        /* Cores de Período */
        .p-amanhecer { background-color: #d4a373; color: #000; font-weight: bold; }
        .p-manha     { background-color: #64b5f6; color: #000; font-weight: bold; }
        .p-dia       { background-color: #e9c46a; color: #000; font-weight: bold; }
        .p-anoitecer { background-color: #f4a261; color: #000; font-weight: bold; }
        .p-noite     { background-color: #1d3557; color: #fff; }

        /* Seção da Calculadora Haversine */
        .calc-section {
            background-color: #222227;
            border: 1px solid #3a3a42;
            border-radius: 8px;
            padding: 15px;
            margin-top: 5px;
        }
        .calc-title {
            font-size: 0.95rem;
            font-weight: bold;
            color: #4ea8de;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .calc-controls {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }
        .calc-results {
            margin-top: 12px;
            display: flex;
            gap: 20px;
            background-color: #18181c;
            padding: 10px 15px;
            border-radius: 6px;
            font-size: 0.88rem;
            flex-wrap: wrap;
        }
        .calc-results span { color: #4ea8de; font-weight: bold; }
    </style>
</head>

    <button class="btn-principal" onclick="toggleModal(true)">Abrir Tabela & Calculadora de Voo</button>

            <div class="legend">

                <div class="legend-item"><div class="color-box p-dia"></div> Dia (12h-16h)</div>

            <!-- Calculadora de Distância e Tempo de Voo -->

                </div>
            </div>
        </div>
    </div>

            { name: "Ulaanbaatar (Mongólia)", offset: 8, lat: 47.8864, lon: 106.9057 },
            { name: "Valeta (Malta)", offset: 1, lat: 35.8997, lon: 14.5148 },
            { name: "Varsóvia (Polônia)", offset: 1, lat: 52.2297, lon: 21.0122 },
            { name: "Viena (Áustria)", offset: 1, lat: 48.2082, lon: 16.3738 },
            { name: "Vientiane (Laos)", offset: 7, lat: 17.9757, lon: 102.6331 },
            { name: "Vilnius (Lituânia)", offset: 2, lat: 54.6872, lon: 25.2797 },
            { name: "Washington, D.C. (Estados Unidos)", offset: -5, lat: 38.9072, lon: -77.0369 },
            { name: "Wellington (Nova Zelândia)", offset: 12, lat: -41.2865, lon: 174.7762 },
            { name: "Iamussucro (Costa do Marfim)", offset: 0, lat: 6.8276, lon: -5.2893 },
            { name: "Ierevan (Armênia)", offset: 4, lat: 40.1872, lon: 44.5152 },
            { name: "Iaundé (Camarões)", offset: 1, lat: 3.8480, lon: 11.5021 },
            { name: "Zagreb (Croácia)", offset: 1, lat: 45.8150, lon: 15.9819 }
        ];

        // Índices ativos da tabela de fusos
        let indicesAtivos = [
            capitaisMundo.findIndex(c => c.name.startsWith("Brasília")),
            capitaisMundo.findIndex(c => c.name.startsWith("Lisboa")),
            capitaisMundo.findIndex(c => c.name.startsWith("Tóquio"))
        ];

        function toggleModal(open) {
            const overlay = document.getElementById('modalOverlay');
            if (open) overlay.classList.add('active');
            else overlay.classList.remove('active');
        }

        function obterClassePeriodo(hora) {
            if (hora >= 5 && hora <= 6) return 'p-amanhecer';
            if (hora >= 7 && hora <= 11) return 'p-manha';
            if (hora >= 12 && hora <= 16) return 'p-dia';
            if (hora >= 17 && hora <= 18) return 'p-anoitecer';
            return 'p-noite'; 
        }

        function inicializarSeletores() {
            const selOrigem = document.getElementById('calc-origem');
            const selDestino = document.getElementById('calc-destino');
            
            selOrigem.innerHTML = '';
            selDestino.innerHTML = '';

            for (let i = 0; i < 3; i++) {
                const select = document.getElementById(`sel-${i}`);
                select.innerHTML = '';
                capitaisMundo.forEach((capital, index) => {
                    const opt = document.createElement('option');
                    opt.value = index;
                    const fusoStr = capital.offset >= 0 ? `+${capital.offset}` : capital.offset;
                    opt.textContent = `${capital.name} (UTC ${fusoStr})`;
                    
                    if (index === indicesAtivos[i]) opt.selected = true;
                    select.appendChild(opt);
                });
            }

            // Popula os seletores da calculadora
            capitaisMundo.forEach((capital, index) => {
                const optO = document.createElement('option');
                optO.value = index;
                optO.textContent = capital.name;
                selOrigem.appendChild(optO);

                const optD = document.createElement('option');
                optD.value = index;
                optD.textContent = capital.name;
                selDestino.appendChild(optD);
            });

            // Padrão: Brasília -> Tóquio
            selOrigem.value = indicesAtivos[0];
            selDestino.value = indicesAtivos[2];
            
            calcularVoo();
        }

        function alterarFuso(seletorIdx, capitalIndex) {
            indicesAtivos[seletorIdx] = parseInt(capitalIndex, 10);
            renderizarRegua();
        }

        function renderizarRegua() {
            const headerRow = document.getElementById('header-row');
            const tbody = document.getElementById('table-body');
            
            headerRow.innerHTML = '<th class="city-header">Capital Base</th>';
            tbody.innerHTML = '';

            const capitalReferencia = capitaisMundo[indicesAtivos[0]];
            const fusoReferencia = capitalReferencia.offset;

            for (let i = 0; i < 24; i++) {
                const th = document.createElement('th');
                th.textContent = i.toString().padStart(2, '0');
                headerRow.appendChild(th);
            }

            indicesAtivos.forEach((capIdx) => {
                const capitalAtual = capitaisMundo[capIdx];
                const fusoAtual = capitalAtual.offset;
                
                const tr = document.createElement('tr');
                const tdNome = document.createElement('td');
                tdNome.className = 'city-header';
                tdNome.innerHTML = `<strong>${capitalAtual.name.split(' (')[0]}</strong>`;
                tr.appendChild(tdNome);

                for (let i = 0; i < 24; i++) {
                    const diferenca = fusoAtual - fusoReferencia;
                    let horaCalculada = (i + diferenca) % 24;
                    if (horaCalculada < 0) horaCalculada += 24; 

                    const horaInteira = Math.floor(horaCalculada);
                    const minutos = Math.round((horaCalculada - horaInteira) * 60);
                    
                    const tdHora = document.createElement('td');
                    tdHora.textContent = minutos > 0 
                        ? `${horaInteira.toString().padStart(2, '0')}:${minutos.toString().padStart(2, '0')}`
                        : horaInteira.toString().padStart(2, '0');

                    tdHora.className = obterClassePeriodo(horaInteira);
                    tr.appendChild(tdHora);
                }
                tbody.appendChild(tr);
            });
        }

        // --- CÁLCULO DE HAVERSINE & TEMPO DE VOO ---
        function haversine(lat1, lon1, lat2, lon2) {
            const R = 6371; // Raio da Terra em km
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon / 2) * Math.sin(dLon / 2);
                      
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c; // Distância em km
        }

        function calcularVoo() {
            const idxO = parseInt(document.getElementById('calc-origem').value, 10);
            const idxD = parseInt(document.getElementById('calc-destino').value, 10);
            
            const orig = capitaisMundo[idxO];
            const dest = capitaisMundo[idxD];

            const distancia = haversine(orig.lat, orig.lon, dest.lat, dest.lon);

            // Premissa: Velocidade cruzeiro de avião comercial ~ 850 km/h + 30 minutos de subida/descida/taxiamento
            let horasDecimais = (distancia / 850) + (distancia > 0 ? 0.5 : 0);
            
            const horas = Math.floor(horasDecimais);
            const minutos = Math.round((horasDecimais - horas) * 60);

            // Diferença de fuso horário
            const difFuso = dest.offset - orig.offset;
            const fusoStr = difFuso >= 0 ? `+${difFuso}h` : `${difFuso}h`;

            document.getElementById('res-distancia').textContent = `${Math.round(distancia).toLocaleString('pt-BR')} km`;
            document.getElementById('res-tempo').textContent = `${horas}h ${minutos}min`;
            document.getElementById('res-fuso').textContent = fusoStr;
        }

        inicializarSeletores();
        renderizarRegua();
    </script>
