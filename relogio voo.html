<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Global de Capitais & Calculadora de Voo</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1, h2 { text-align: center; color: var(--accent); }

        .container {
            width: 100%;
            max-width: 1000px;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        /* Seção do Relógio */
        .clocks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 15px;
        }

        .clock-box {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }

        .time-display {
            font-size: 2rem;
            font-weight: bold;
            color: var(--accent);
            font-family: monospace;
            margin: 10px 0;
        }

        select, input {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background-color: var(--bg-color);
            color: var(--text);
            box-sizing: border-box;
            margin-top: 5px;
        }

        /* Barra de Pesquisa de Capitais */
        .search-results {
            max-height: 150px;
            overflow-y: auto;
            border: 1px solid var(--border);
            border-radius: 6px;
            margin-top: 5px;
            background: var(--bg-color);
            display: none;
        }

        .search-item {
            padding: 8px 12px;
            cursor: pointer;
            border-bottom: 1px solid var(--border);
        }

        .search-item:hover { background-color: var(--card-bg); }

        /* Seção do Calculador de Voo */
        .flight-stop {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 10px;
        }

        .btn {
            background-color: var(--accent);
            color: #000;
            font-weight: bold;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn:hover { opacity: 0.9; }

        .btn-danger {
            background-color: #ef4444;
            color: #fff;
            padding: 10px;
        }

        .result-box {
            margin-top: 15px;
            padding: 12px;
            background-color: var(--bg-color);
            border-radius: 6px;
            text-align: center;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Painel de Capitais, Fusos Horários e Rotas</h1>

    <!-- Busca Rápida -->
    <div class="card">
        <h2>Pesquisar Capital / Fuso</h2>
        <input type="text" id="capitalSearch" placeholder="Digite o nome de uma capital ou país..." oninput="filterCapitals()">
        <div id="searchResults" class="search-results"></div>
    </div>

    <!-- Relógios de 3 Fusos -->
    <div class="card">
        <h2>Relógio Mundial (3 Fusos)</h2>
        <div class="clocks-grid">
            <div class="clock-box">
                <label for="select1">Localização 1:</label>
                <select id="select1" onchange="updateClocks()"></select>
                <div class="time-display" id="clock1">00:00:00</div>
                <div id="date1" style="color: var(--text-muted); font-size: 0.9rem;">---</div>
            </div>
            <div class="clock-box">
                <label for="select2">Localização 2:</label>
                <select id="select2" onchange="updateClocks()"></select>
                <div class="time-display" id="clock2">00:00:00</div>
                <div id="date2" style="color: var(--text-muted); font-size: 0.9rem;">---</div>
            </div>
            <div class="clock-box">
                <label for="select3">Localização 3:</label>
                <select id="select3" onchange="updateClocks()"></select>
                <div class="time-display" id="clock3">00:00:00</div>
                <div id="date3" style="color: var(--text-muted); font-size: 0.9rem;">---</div>
            </div>
        </div>
    </div>

    <!-- Calculadora de Distância de Voo -->
    <div class="card">
        <h2>Calculadora de Distância de Voo</h2>
        <div id="flightStops">
            <div class="flight-stop">
                <select class="flight-select"><option value="">Origem...</option></select>
            </div>
            <div class="flight-stop">
                <select class="flight-select"><option value="">Destino Final...</option></select>
            </div>
        </div>
        <div style="display: flex; gap: 10px; margin-top: 10px;">
            <button class="btn" onclick="addStop()">+ Adicionar Escala</button>
            <button class="btn" onclick="calculateDistance()">Calcular Distância</button>
        </div>
        <div class="result-box" id="flightResult">Selecione os pontos da rota para calcular a distância e o tempo estimado.</div>
    </div>
</div>

<script>
// Banco de dados com Capitais, Países, Coordenadas (Lat/Lon) e Fuso Horário (Offset UTC em horas)
const database = [

    { capital: "Drammen", country: "Suíça", tz: 1, lat: 46.9480, lon: 7.4474 }, // Berna
    { capital: "Berna", country: "Suíça", tz: 1, lat: 46.9480, lon: 7.4474 },
    { capital: "Pristina", country: "Kosovo", tz: 1, lat: 42.6629, lon: 21.1655 },
    { capital: "Taipé", country: "Taiwan", tz: 8, lat: 25.0330, lon: 121.5654 },
    { capital: "Mombaça", country: "Somalilândia", tz: 3, lat: 9.5600, lon: 44.0650 }, // Hargeisa
    { capital: "Hargeisa", country: "Somalilândia", tz: 3, lat: 9.5600, lon: 44.0650 },
    { capital: "Montevidéu", country: "Uruguai", tz: -3, lat: -34.9011, lon: -56.1645 },
    { capital: "Caracas", country: "Venezuela", tz: -4, lat: 10.4806, lon: -66.9036 }
    // As demais capitais podem ser adicionadas mantendo essa mesma estrutura de objeto.
];

// Inicialização de Seletores
function initSelectors() {
    const selects = [document.getElementById('select1'), document.getElementById('select2'), document.getElementById('select3')];
    
    // Ordenar alfabeticamente
    database.sort((a, b) => a.capital.localeCompare(b.capital));

    selects.forEach((select, index) => {
        select.innerHTML = '';
        database.forEach((item, i) => {
            const opt = document.createElement('option');
            opt.value = i;
            opt.textContent = `${item.capital} (${item.country}) - UTC${item.tz >= 0 ? '+' : ''}${item.tz}`;
            select.appendChild(opt);
        });
    });

    // Padrões Iniciais (Brasília, Londres, Tóquio)
    if(selects[0]) selects[0].value = database.findIndex(x => x.capital === "Brasília");
    if(selects[1]) selects[1].value = database.findIndex(x => x.capital === "Londres");
    if(selects[2]) selects[2].value = database.findIndex(x => x.capital === "Tóquio");

    updateFlightSelects();
}

// Atualização dos Relógios
function updateClocks() {
    for (let i = 1; i <= 3; i++) {
        const select = document.getElementById(`select${i}`);
        const clockEl = document.getElementById(`clock${i}`);
        const dateEl = document.getElementById(`date${i}`);
        
        const item = database[select.value];
        if (!item) continue;

        const now = new Date();
        const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
        const cityTime = new Date(utc + (3600000 * item.tz));

        clockEl.textContent = cityTime.toLocaleTimeString('pt-BR');
        dateEl.textContent = cityTime.toLocaleDateString('pt-BR', { weekday: 'short', day: 'numeric', month: 'short' });
    }
}

// Barra de Pesquisa Integrada
function filterCapitals() {
    const query = document.getElementById('capitalSearch').value.toLowerCase();
    const resultsDiv = document.getElementById('searchResults');
    resultsDiv.innerHTML = '';

    if (query.trim() === '') {
        resultsDiv.style.display = 'none';
        return;
    }

    const filtered = database.filter(item => 
        item.capital.toLowerCase().includes(query) || 
        item.country.toLowerCase().includes(query)
    );

    if (filtered.length > 0) {
        resultsDiv.style.display = 'block';
        filtered.forEach(item => {
            const div = document.createElement('div');
            div.className = 'search-item';
            div.textContent = `${item.capital} - ${item.country} (Fuso: UTC${item.tz >= 0 ? '+' : ''}${item.tz})`;
            div.onclick = () => {
                document.getElementById('select1').value = database.indexOf(item);
                updateClocks();
                resultsDiv.style.display = 'none';
                document.getElementById('capitalSearch').value = '';
            };
            resultsDiv.appendChild(div);
        });
    } else {
        resultsDiv.style.display = 'none';
    }
}

// Lógica para Cálculo de Voo
function updateFlightSelects() {
    const flightSelects = document.querySelectorAll('.flight-select');
    flightSelects.forEach(select => {
        const currentVal = select.value;
        select.innerHTML = '<option value="">Selecione a capital...</option>';
        database.forEach((item, i) => {
            const opt = document.createElement('option');
            opt.value = i;
            opt.textContent = `${item.capital} (${item.country})`;
            select.appendChild(opt);
        });
        select.value = currentVal;
    });
}

function addStop() {
    const container = document.getElementById('flightStops');
    const stops = container.getElementsByClassName('flight-stop');
    
    const div = document.createElement('div');
    div.className = 'flight-stop';
    
    const select = document.createElement('select');
    select.className = 'flight-select';
    
    const removeBtn = document.createElement('button');
    removeBtn.className = 'btn btn-danger';
    removeBtn.textContent = 'X';
    removeBtn.onclick = () => { div.remove(); };

    div.appendChild(select);
    div.appendChild(removeBtn);
    
    // Inserir antes do último elemento (Destino)
    container.insertBefore(div, stops[stops.length - 1]);
    updateFlightSelects();
}

// Haversine Formula para Calcular Distância em Km
function getDistanceInKm(lat1, lon1, lat2, lon2) {
    const R = 6371; // Raio da Terra em km
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = 
        Math.sin(dLat/2) * Math.sin(dLat/2) +
        Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
        Math.sin(dLon/2) * Math.sin(dLon/2);
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    return R * c;
}

function calculateDistance() {
    const selects = document.querySelectorAll('.flight-select');
    let totalDistance = 0;
    let path = [];

    for (let i = 0; i < selects.length; i++) {
        const index = selects[i].value;
        if (index === "") {
            document.getElementById('flightResult').textContent = "Por favor, preencha todos os pontos da rota.";
            return;
        }
        path.push(database[index]);
    }

    for (let i = 0; i < path.length - 1; i++) {
        totalDistance += getDistanceInKm(path[i].lat, path[i].lon, path[i + 1].lat, path[i + 1].lon);
    }

    // Estimativa genérica: 800 km/h velocidade de cruzeiro + 30 min por escala
    const flightHours = totalDistance / 800;
    const layoverHours = (path.length - 2) * 1.5; // Ex: 1h30m de tempo por escala
    const totalTimeHours = flightHours + (layoverHours > 0 ? layoverHours : 0);

    document.getElementById('flightResult').innerHTML = `
        <strong>Distância Total:</strong> ${Math.round(totalDistance).toLocaleString('pt-BR')} km<br>
        <strong>Tempo Estimado em Voo:</strong> ~${Math.floor(totalTimeHours)}h ${Math.round((totalTimeHours % 1) * 60)}m 
        <small>(${path.length - 2} escala(s) considerada(s))</small>
    `;
}

// Inicialização do App
window.onload = () => {
    initSelectors();
    updateClocks();
    setInterval(updateClocks, 1000);
};
</script>
</body>
</html>
