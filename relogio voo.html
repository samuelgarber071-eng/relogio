<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relógio Mundial & Calculadora de Voo</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 11px;
        }

        body {
            background-color: #798396;
            color: #000;
            padding: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Container otimizado para Tablet 9" (Ex: 1024x600 ou similar) */
        .tablet-container {
            width: 100%;
            max-width: 980px;
            background: #d4d0c8;
            border: 3px outset #ffffff;
            padding: 6px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.4);
        }

        /* Top Bar estilo clássico */
        .header-bar {
            background: linear-gradient(90deg, #000080, #1084d0);
            color: #fff;
            padding: 4px 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            border: 2px outset #ffffff;
        }

        .header-title {
            font-size: 12px;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .main-layout {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 6px;
        }

        /* Painel Esquerdo: Relógio Relíquia */
        .clock-panel {
            background: #ece9d8;
            border: 2px outset #ffffff;
            padding: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .clock-face {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: radial-gradient(circle, #ffffff 60%, #c0c0c0 100%);
            border: 6px solid #404040;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5), 0 4px 6px rgba(0,0,0,0.3);
            position: relative;
        }

        .clock-center {
            width: 10px;
            height: 10px;
            background: #d00;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
        }

        .hand {
            position: absolute;
            bottom: 50%;
            left: 50%;
            transform-origin: bottom center;
            border-radius: 4px;
        }

        .hand.hour {
            width: 4px;
            height: 45px;
            background: #000;
            z-index: 5;
        }

        .hand.minute {
            width: 3px;
            height: 65px;
            background: #222;
            z-index: 6;
        }

        .hand.second {
            width: 1px;
            height: 75px;
            background: #d00;
            z-index: 7;
        }

        /* Marcas de horas do relógio */
        .clock-mark {
            position: absolute;
            width: 2px;
            height: 8px;
            background: #555;
            left: 50%;
            transform-origin: 0 90px;
        }

        .digital-box {
            background: #000;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            font-size: 16px;
            font-weight: bold;
            padding: 4px 10px;
            border: 2px inset #ffffff;
            letter-spacing: 1px;
            text-align: center;
            width: 100%;
        }

        /* Painel Direito: Abas e Conteúdo */
        .content-panel {
            background: #ece9d8;
            border: 2px outset #ffffff;
            padding: 6px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        /* Estilo das Abas */
        .tabs {
            display: flex;
            gap: 2px;
            border-bottom: 2px solid #808080;
        }

        .tab-btn {
            background: #d4d0c8;
            border: 2px outset #ffffff;
            border-bottom: none;
            padding: 4px 10px;
            font-weight: bold;
            cursor: pointer;
        }

        .tab-btn.active {
            background: #ece9d8;
            border-bottom: 2px solid #ece9d8;
            margin-bottom: -2px;
        }

        .tab-content {
            display: none;
            flex-direction: column;
            gap: 6px;
        }

        .tab-content.active {
            display: flex;
        }

        /* Controles, Inputs e Selects */
        .control-row {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        input[type="text"], select {
            background: #fff;
            border: 2px inset #ffffff;
            padding: 3px 5px;
            outline: none;
        }

        button {
            background: #d4d0c8;
            border: 2px outset #ffffff;
            padding: 3px 8px;
            font-weight: bold;
            cursor: pointer;
        }

        button:active {
            border-style: inset;
        }

        /* Tabela Estilo Fuso Horário */
        .table-wrap {
            max-height: 320px;
            overflow-y: auto;
            overflow-x: auto;
            border: 2px inset #ffffff;
            background: #fff;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            white-space: nowrap;
        }

        th, td {
            border: 1px solid #808080;
            padding: 3px 5px;
            text-align: center;
        }

        th {
            background: #d4d0c8;
            position: sticky;
            top: 0;
            z-index: 2;
        }

        .col-city {
            text-align: left;
            background: #f4f0e6;
            font-weight: bold;
            position: sticky;
            left: 0;
            z-index: 1;
        }

        /* Cores de Período do Dia */
        .p-amanhecer { background-color: #f8c28c; }
        .p-manha { background-color: #add8e6; }
        .p-dia { background-color: #ffffff; }
        .p-anoitecer { background-color: #f4a460; }
        .p-noite { background-color: #4682b4; color: #fff; }

        .current-hour {
            outline: 2px solid #000080;
            font-weight: bold;
        }

        /* Calculadora de Voo */
        .flight-builder {
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: #fff;
            border: 2px inset #ffffff;
            padding: 8px;
        }

        .waypoint-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .flight-summary {
            background: #fff8dc;
            border: 1px solid #b8860b;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .summary-title {
            font-weight: bold;
            color: #000080;
            border-bottom: 1px solid #ccc;
            padding-bottom: 2px;
        }

        /* Scrollbars Retrô */
        ::-webkit-scrollbar {
            width: 12px;
            height: 12px;
        }
        ::-webkit-scrollbar-track {
            background: #d4d0c8;
        }
        ::-webkit-scrollbar-thumb {
            background: #c0c0c0;
            border: 2px outset #ffffff;
        }
    </style>
</head>
<body>

<div class="tablet-container">

    <div class="header-bar">
        <div class="header-title">
            <span>🌐 MATRIZ MUNDIAL & NAVEGAÇÃO AÉREA</span>
        </div>
        <span id="utcClock" style="font-family: monospace;">UTC: 00:00:00</span>
    </div>

    <div class="main-layout">

        <!-- LADO ESQUERDO: RELÓGIO E REFERÊNCIA -->
        <div class="clock-panel">
            <div style="font-weight: bold; color: #000080;">CIDADE DE REFERÊNCIA</div>
            
            <select id="refSelect" style="width: 100%;" onchange="updateClock()"></select>

            <div class="clock-face" id="clockFace">
                <div class="clock-center"></div>
                <div class="hand hour" id="hourHand"></div>
                <div class="hand minute" id="minuteHand"></div>
                <div class="hand second" id="secondHand"></div>
            </div>

            <div class="digital-box" id="digitalClock">00:00:00</div>
            
            <div id="locationDetails" style="text-align: center; font-size: 10px; color: #333;">
                <!-- Preenchido via JS -->
            </div>
        </div>

        <!-- LADO DIREITO: FUSOS & CÁLCULO DE VOO -->
        <div class="content-panel">
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('tabFusos', this)">Tabela de Fusos</button>
                <button class="tab-btn" onclick="switchTab('tabVoo', this)">Calculadora de Voo</button>
            </div>

            <!-- ABA 1: TABELA DE FUSOS COM BUSCA -->
            <div id="tabFusos" class="tab-content active">
                <div class="control-row">
                    <input type="text" id="searchInput" placeholder="Pesquisar País ou Cidade..." style="flex: 1;" oninput="filterTable()">
                    <select id="regionFilter" onchange="filterTable()">
                        <option value="ALL">Todos os Continentes</option>
                        <option value="África">África</option>
                        <option value="América">América</option>
                        <option value="Ásia">Ásia</option>
                        <option value="Europa">Europa</option>
                        <option value="Oceania">Oceania</option>
                    </select>
                </div>

                <div class="table-wrap">
                    <table id="matrixTable">
                        <!-- Gerado via JS -->
                    </table>
                </div>
            </div>

            <!-- ABA 2: CALCULADORA DE DISTÂNCIA DE VOO -->
            <div id="tabVoo" class="tab-content">
                <div class="flight-builder">
                    <div style="font-weight: bold; color: #000080;">ROTA DE VOO COM ESCALAS</div>
                    
                    <div id="waypointsContainer" style="display: flex; flex-direction: column; gap: 4px;">
                        <!-- Trechos gerados via JS -->
                    </div>

                    <div style="display: flex; gap: 6px; margin-top: 4px;">
                        <button onclick="addWaypoint()">+ Adicionar Escala</button>
                        <button onclick="calculateFlight()">✈ Calcular Distância & Tempo</button>
                    </div>
                </div>

                <div class="flight-summary" id="flightResults">
                    <div class="summary-title">Resumo do Voo</div>
                    <div>Selecione a origem, destino e escalas para calcular.</div>
                </div>
            </div>

        </div>

    </div>

</div>

// Atualização do Relógio Analógico e Digital
function updateClock() {
    const now = new Date();
    document.getElementById("utcClock").textContent = "UTC: " + now.toISOString().substr(11, 8);

    const refIndex = document.getElementById("refSelect").value;
    const refData = rawDb[refIndex];

    // Obter data/hora na zona selecionada
    const locString = now.toLocaleString("en-US", { timeZone: refData.tz });
    const locDate = new Date(locString);

    const hrs = locDate.getHours();
    const mins = locDate.getMinutes();
    const secs = locDate.getSeconds();

    // Atualizar Ponteiros
    const secDeg = (secs / 60) * 360;
    const minDeg = ((mins + secs / 60) / 60) * 360;
    const hrDeg = (((hrs % 12) + mins / 60) / 12) * 360;

    document.getElementById("secondHand").style.transform = `rotate(${secDeg}deg)`;
    document.getElementById("minuteHand").style.transform = `rotate(${minDeg}deg)`;
    document.getElementById("hourHand").style.transform = `rotate(${hrDeg}deg)`;

    // Digital
    const strHrs = String(hrs).padStart(2, '0');
    const strMins = String(mins).padStart(2, '0');
    const strSecs = String(secs).padStart(2, '0');
    document.getElementById("digitalClock").textContent = `${strHrs}:${strMins}:${strSecs}`;

    document.getElementById("locationDetails").innerHTML = `
        <b>Lat:</b> ${refData.lat.toFixed(2)} | <b>Lon:</b> ${refData.lon.toFixed(2)}<br>
        <b>Fuso:</b> ${refData.tz}
    `;

    // Atualiza tabela para destacar a hora atual da cidade ref
    renderMatrixTable();
}

// Classe do Período do Dia
function getPeriodClass(h) {
    if (h >= 5 && h <= 6) return 'p-amanhecer';
    if (h >= 7 && h <= 11) return 'p-manha';
    if (h >= 12 && h <= 16) return 'p-dia';
    if (h >= 17 && h <= 18) return 'p-anoitecer';
    return 'p-noite';
}

// Cálculo de Diferença UTC
function getUTCOffset(tz) {
    const now = new Date();
    const utcDate = new Date(now.toLocaleString('en-US', { timeZone: 'UTC' }));
    const tzDate = new Date(now.toLocaleString('en-US', { timeZone: tz }));
    return (tzDate - utcDate) / 3600000;
}

// Filtro e Busca da Tabela
function filterTable() {
    const q = document.getElementById("searchInput").value.toLowerCase();
    const reg = document.getElementById("regionFilter").value;

    currentFilteredList = rawDb.filter(item => {
        const matchesText = item.c.toLowerCase().includes(q) || item.k.toLowerCase().includes(q);
        const matchesReg = (reg === "ALL" || item.reg === reg);
        return matchesText && matchesReg;
    });

    renderMatrixTable();
}

// Renderizar Tabela de Fusos
function renderMatrixTable() {
    const refIndex = document.getElementById("refSelect").value;
    const refData = rawDb[refIndex];
    const refOffset = getUTCOffset(refData.tz);

    const now = new Date();
    const refLocDate = new Date(now.toLocaleString("en-US", { timeZone: refData.tz }));
    const currentRefHour = refLocDate.getHours();

    let html = `
        <thead>
            <tr>
                <th class="col-city">País / Capital</th>
                ${Array.from({length: 24}, (_, i) => `<th>${String(i).padStart(2,'0')}h</th>`).join('')}
            </tr>
        </thead>
        <tbody>
    `;

    currentFilteredList.forEach(item => {
        const itemOffset = getUTCOffset(item.tz);
        const diff = itemOffset - refOffset;

        html += `<tr>`;
        html += `<td class="col-city">${item.c}<br><span style="font-weight:normal; font-size:9px; color:#555;">${item.k}</span></td>`;

        for (let h = 0; h < 24; h++) {
            let localH = (h + diff) % 24;
            if (localH < 0) localH += 24;

            const period = getPeriodClass(localH);
            const isCurrent = (h === currentRefHour) ? 'current-hour' : '';
            const formatted = String(Math.floor(localH)).padStart(2, '0');

            html += `<td class="${period} ${isCurrent}">${formatted}</td>`;
        }

        html += `</tr>`;
    });

    html += `</tbody>`;
    document.getElementById("matrixTable").innerHTML = html;
}

// Distância Haversine em Km
function haversine(lat1, lon1, lat2, lon2) {
    const R = 6371; // Raio da Terra em km
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
              Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
              Math.sin(dLon/2) * Math.sin(dLon/2);
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    return R * c;
}

function calculateFlight() {
    const selects = document.querySelectorAll(".flight-wp-select");
    if (selects.length < 2) return;

    let totalDistKm = 0;
    let legsHtml = "";

    for (let i = 0; i < selects.length - 1; i++) {
        const p1 = rawDb[selects[i].value];
        const p2 = rawDb[selects[i+1].value];

        const dist = haversine(p1.lat, p1.lon, p2.lat, p2.lon);
        totalDistKm += dist;

        legsHtml += `<div>• <b>Trecho ${i+1}:</b> ${p1.k} (${p1.c}) ➔ ${p2.k} (${p2.c}) = <b>${Math.round(dist).toLocaleString('pt-BR')} km</b></div>`;
    }

    const totalNM = totalDistKm * 0.539957; // Milhas Náuticas
    // Média de velocidade comercial ~800 km/h + 45 min de manobra/escala
    const flightHours = totalDistKm / 800 + ((selects.length - 2) * 1.5); 

    const h = Math.floor(flightHours);
    const m = Math.round((flightHours - h) * 60);

    const resDiv = document.getElementById("flightResults");
    resDiv.innerHTML = `
        <div class="summary-title">Resumo do Voo Estimado</div>
        ${legsHtml}
        <hr style="margin: 4px 0;">
        <div><b>Distância Total:</b> ${Math.round(totalDistKm).toLocaleString('pt-BR')} km (${Math.round(totalNM).toLocaleString('pt-BR')} NM)</div>
        <div><b>Tempo Estimado no Ar:</b> ~${h}h ${m}min (Velocidade média ~800 km/h)</div>
    `;
}
</script>

</body>
</html>
