<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Global de Fusos & Voos</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Tahoma, Verdana, Arial, sans-serif;
            font-size: 11px;
        }

        body {
            background-color: #d4d0c8;
            color: #000000;
            padding: 10px;
            display: flex;
            justify-content: center;
        }

        .app {
            width: 100%;
            max-width: 960px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* Header e Barra de Pesquisa */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 8px;
            background: #000080;
            color: #ffffff;
            border: 2px outset #ffffff;
            gap: 8px;
        }

        .header h1 {
            font-size: 12px;
            font-weight: bold;
            color: #ffffff;
            white-space: nowrap;
        }

        .search-wrap {
            position: relative;
            flex: 1;
            max-width: 280px;
        }

        input, select, button {
            background: #ffffff;
            color: #000000;
            border: 2px inset #ffffff;
            padding: 2px 4px;
            height: 22px;
            outline: none;
            border-radius: 0;
        }

        input { width: 100%; }

        .search-results {
            position: absolute;
            top: 24px;
            left: 0;
            right: 0;
            background: #ffffff;
            border: 2px solid #000000;
            max-height: 180px;
            overflow-y: auto;
            z-index: 100;
            display: none;
        }

        .search-item {
            padding: 3px 6px;
            cursor: pointer;
            border-bottom: 1px solid #d4d0c8;
            display: flex;
            justify-content: space-between;
        }

        .search-item:hover {
            background: #000080;
            color: #ffffff;
        }

        .card {
            background: #ece9d8;
            border: 2px outset #ffffff;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .card-title {
            font-size: 11px;
            font-weight: bold;
            color: #000080;
            border-bottom: 1px solid #808080;
            padding-bottom: 2px;
            text-transform: uppercase;
        }

        /* Controles da Tabela */
        .select-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
        }

        .select-box {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .select-box label {
            font-weight: bold;
        }

        /* Tabela Matriz */
        .table-wrap {
            overflow-x: auto;
            border: 2px inset #ffffff;
            background: #ffffff;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            text-align: center;
            white-space: nowrap;
        }

        th, td {
            border: 1px solid #808080;
            padding: 3px 4px;
            font-size: 10px;
        }

        th {
            background: #d4d0c8;
            font-weight: bold;
        }

        .col-city {
            text-align: left;
            font-weight: bold;
            background: #ece9d8;
            min-width: 140px;
            padding-left: 6px;
        }

        /* Cores dos Períodos */
        .p-amanhecer { background-color: #f8c28c; color: #000; }
        .p-manha { background-color: #add8e6; color: #000; }
        .p-dia { background-color: #ffffff; color: #000; }
        .p-anoitecer { background-color: #f4a460; color: #000; }
        .p-noite { background-color: #4682b4; color: #fff; }

        .current-hour {
            outline: 2px solid #000080;
            font-weight: bold;
        }

        /* Legenda */
        .legend {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            padding: 4px;
            background: #ffffff;
            border: 1px solid #808080;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 10px;
        }

        .legend-color {
            width: 12px;
            height: 12px;
            border: 1px solid #000;
        }

        /* Voo & Escalas */
        .stops-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .stop-row {
            display: flex;
            gap: 4px;
            align-items: center;
        }

        .stop-row label {
            width: 65px;
            font-size: 11px;
        }

        .stop-row select { flex: 1; }

        .btn {
            cursor: pointer;
            font-weight: bold;
            background: #d4d0c8;
            color: #000000;
            border: 2px outset #ffffff;
            padding: 0 8px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn:active { border-style: inset; }

        .btn-del {
            color: #c00000;
            width: 22px;
            padding: 0;
            font-weight: bold;
        }

        .actions {
            display: flex;
            gap: 4px;
        }

        .result-panel {
            background: #ffffff;
            border: 2px inset #ffffff;
            padding: 6px;
            display: none;
            font-size: 11px;
        }

        .result-panel .total {
            font-weight: bold;
            color: #000080;
        }

        @media (max-width: 650px) {
            .header { flex-direction: column; align-items: stretch; }
            .search-wrap { max-width: 100%; }
            .select-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="app">

    <!-- Header com Busca -->
    <div class="header">
        <h1>Painel Global de Fusos Horários</h1>
        <div class="search-wrap">
            <input type="text" id="searchInput" placeholder="Pesquisar país ou capital..." autocomplete="off">
            <div class="search-results" id="searchResults"></div>
        </div>
    </div>

    <!-- Tabela Matriz de Fusos -->
    <div class="card">
        <div class="card-title">Matriz Comparativa de 24 Horas</div>
        
        <div class="select-grid">
            <div class="select-box">
                <label>Linha 1 (Referência):</label>
                <select id="tz1" onchange="renderTable()"></select>
            </div>
            <div class="select-box">
                <label>Linha 2:</label>
                <select id="tz2" onchange="renderTable()"></select>
            </div>
            <div class="select-box">
                <label>Linha 3:</label>
                <select id="tz3" onchange="renderTable()"></select>
            </div>
        </div>

        <div class="legend">
            <div class="legend-item"><div class="legend-color p-amanhecer"></div> Amanhecer (05h-06h)</div>
            <div class="legend-item"><div class="legend-color p-manha"></div> Manhã (07h-11h)</div>
            <div class="legend-item"><div class="legend-color p-dia"></div> Dia (12h-16h)</div>
            <div class="legend-item"><div class="legend-color p-anoitecer"></div> Anoitecer (17h-18h)</div>
            <div class="legend-item"><div class="legend-color p-noite"></div> Noite/Madrugada (19h-04h)</div>
        </div>

        <div class="table-wrap">
            <table id="timeTable"></table>
        </div>
    </div>

    <!-- Calculadora de Voo -->
    <div class="card">
        <div class="card-title">Calculadora de Distância de Voo & Escalas</div>
        
        <div class="stops-list" id="stopsList">
            <div class="stop-row" id="rowOrigin">
                <label>Origem:</label>
                <select class="flight-select"><option value="">Selecione...</option></select>
            </div>
            <div class="stop-row" id="rowDestination">
                <label>Destino:</label>
                <select class="flight-select"><option value="">Selecione...</option></select>
            </div>
        </div>

        <div class="actions">
            <button class="btn" onclick="addStop()">+ Adicionar Escala</button>
            <button class="btn" onclick="calculateRoute()" style="flex:1;">Calcular Rota</button>
        </div>

        <div class="result-panel" id="resultPanel"></div>
    </div>

</div>

document.addEventListener('DOMContentLoaded', () => {
    initSelects();

function initSelects() {
    const s1 = document.getElementById('tz1');
    const s2 = document.getElementById('tz2');
    const s3 = document.getElementById('tz3');

    db.forEach((item, idx) => {
        const text = `${item.k} (${item.c})`;
        s1.add(new Option(text, idx));
        s2.add(new Option(text, idx));
        s3.add(new Option(text, idx));
    });

    // Padrão inspirado na imagem
    s1.value = db.findIndex(i => i.tz === "America/New_York");
    s2.value = db.findIndex(i => i.tz === "Asia/Jerusalem" || i.tz === "Asia/Gaza");
    s3.value = db.findIndex(i => i.tz === "Asia/Seoul");

    populateFlightSelects();
}

function populateFlightSelects() {
    document.querySelectorAll('.flight-select').forEach(sel => {
        if (sel.options.length <= 1) {
            db.forEach((item, idx) => {
                sel.add(new Option(`${item.k} - ${item.c}`, idx));
            });
        }
    });
}

function getPeriodClass(hour) {
    if (hour >= 5 && hour <= 6) return 'p-amanhecer';
    if (hour >= 7 && hour <= 11) return 'p-manha';
    if (hour >= 12 && hour <= 16) return 'p-dia';
    if (hour >= 17 && hour <= 18) return 'p-anoitecer';
    return 'p-noite';
}

function getUTCOffsetHours(tz, date) {
    const utcDate = new Date(date.toLocaleString('en-US', { timeZone: 'UTC' }));
    const tzDate = new Date(date.toLocaleString('en-US', { timeZone: tz }));
    return (tzDate - utcDate) / 3600000;
}

function renderTable() {
    const idx1 = document.getElementById('tz1').value;
    const idx2 = document.getElementById('tz2').value;
    const idx3 = document.getElementById('tz3').value;

    const loc1 = db[idx1];
    const loc2 = db[idx2];
    const loc3 = db[idx3];

    const now = new Date();
    
    const refTimeStr = now.toLocaleString("en-US", { timeZone: loc1.tz });
    const refDate = new Date(refTimeStr);
    const currentRefHour = refDate.getHours();

    const offset1 = getUTCOffsetHours(loc1.tz, now);
    const offset2 = getUTCOffsetHours(loc2.tz, now);
    const offset3 = getUTCOffsetHours(loc3.tz, now);

    const diff2 = offset2 - offset1;
    const diff3 = offset3 - offset1;

    let html = `
        <thead>
            <tr>
                <th class="col-city">Cidade / Fuso / País</th>
                <th colspan="2" class="p-amanhecer">Amanhecer</th>
                <th colspan="5" class="p-manha">Manhã</th>
                <th colspan="5" class="p-dia">Dia</th>
                <th colspan="2" class="p-anoitecer">Anoitecer</th>
                <th colspan="10" class="p-noite">Noite / Madrugada</th>
            </tr>
        </thead>
        <tbody>
    `;

    const locations = [
        { data: loc1, diff: 0 },
        { data: loc2, diff: diff2 },
        { data: loc3, diff: diff3 }
    ];

    locations.forEach(loc => {
        html += `<tr>`;
        html += `<td class="col-city">${loc.data.k}<br><span style="font-weight:normal; color:#555;">${loc.data.c}</span></td>`;
        
        for (let h = 0; h < 24; h++) {
            let localHour = (h + loc.diff) % 24;
            if (localHour < 0) localHour += 24;
            
            const periodClass = getPeriodClass(localHour);
            const isCurrent = (h === currentRefHour) ? 'current-hour' : '';
            const hourFormatted = String(Math.floor(localHour)).padStart(2, '0');

            html += `<td class="${periodClass} ${isCurrent}" title="Hora local: ${hourFormatted}:00">${hourFormatted}</td>`;
        }
        
        html += `</tr>`;
    });

    html += `</tbody>`;
    document.getElementById('timeTable').innerHTML = html;
}

// Lógica de Busca Instantânea
const searchInput = document.getElementById('searchInput');
const searchResults = document.getElementById('searchResults');

searchInput.addEventListener('input', (e) => {
    const val = e.target.value.toLowerCase().trim();
    if (!val) { searchResults.style.display = 'none'; return; }

    const matches = db.filter(item => item.k.toLowerCase().includes(val) || item.c.toLowerCase().includes(val)).slice(0, 8);

    if (matches.length > 0) {
        searchResults.innerHTML = matches.map(m => `
            <div class="search-item" onclick="selectSearchResult('${m.tz}')">
                <span><strong>${m.k}</strong>, ${m.c}</span>
                <span style="color:#555; font-size:10px;">${m.tz.split('/')[1] || ''}</span>
            </div>
        `).join('');
        searchResults.style.display = 'block';
    } else {
        searchResults.style.display = 'none';
    }
});

document.addEventListener('click', (e) => {
    if (!searchInput.contains(e.target) && !searchResults.contains(e.target)) {
        searchResults.style.display = 'none';
    }
});

function selectSearchResult(tz) {
    const idx = db.findIndex(item => item.tz === tz);
    if (idx !== -1) {
        document.getElementById('tz1').value = idx;
        renderTable();
    }
    searchResults.style.display = 'none';
    searchInput.value = '';
}

// Calculadora de Voo & Escalas
function addStop() {
    const list = document.getElementById('stopsList');
    const destRow = document.getElementById('rowDestination');
    const stops = list.querySelectorAll('.stop-row-escala');
    
    const row = document.createElement('div');
    row.className = 'stop-row stop-row-escala';

    row.innerHTML = `
        <label>Escala ${stops.length + 1}:</label>
        <select class="flight-select"><option value="">Selecione...</option></select>
        <button class="btn btn-del" onclick="removeStop(this)">X</button>
    `;

    list.insertBefore(row, destRow);
    populateFlightSelects();
}

function removeStop(btn) {
    btn.parentElement.remove();
    document.querySelectorAll('.stop-row-escala').forEach((row, idx) => {
        row.querySelector('label').textContent = `Escala ${idx + 1}:`;
    });
}

function calculateRoute() {
    const selects = document.querySelectorAll('.flight-select');
    const points = [];

    selects.forEach(s => {
        if (s.value !== "") points.push(db[s.value]);
    });

    if (points.length < 2) {
        alert("Selecione pelo menos origem e destino!");
        return;
    }

    let totalKm = 0;
    let details = [];

    for (let i = 0; i < points.length - 1; i++) {
        const p1 = points[i], p2 = points[i + 1];
        const dist = haversine(p1.lat, p1.lon, p2.lat, p2.lon);
        totalKm += dist;
        details.push(`${p1.k} -> ${p2.k}: ${Math.round(dist).toLocaleString('pt-BR')} km`);
    }

    const totalHours = totalKm / 800; // Média comercial de 800 km/h
    const h = Math.floor(totalHours);
    const m = Math.round((totalHours - h) * 60);

    const panel = document.getElementById('resultPanel');
    panel.style.display = 'block';
    panel.innerHTML = `
        <div class="total">Distância Total: ${Math.round(totalKm).toLocaleString('pt-BR')} km (${Math.round(totalKm * 0.539957).toLocaleString('pt-BR')} NM)</div>
        <div style="margin-top:2px; color:#333;">Trechos: ${details.join(' | ')}</div>
        <div style="margin-top:2px;">Tempo est. de voo: ~${h > 0 ? h + 'h ' : ''}${m}min (velocidade média de 800 km/h)</div>
    `;
}

function haversine(lat1, lon1, lat2, lon2) {
    const R = 6371;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
              Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
              Math.sin(dLon / 2) * Math.sin(dLon / 2);
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}
