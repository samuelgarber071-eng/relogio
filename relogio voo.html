<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Global: Relógio de Fusos & Calculadora de Voo</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --accent-hover: #0284c7;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 2rem 1rem;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        h1, h2 {
            font-weight: 600;
            color: var(--accent);
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }

        /* Busca */
        .search-box {
            position: relative;
        }

        input, select, button {
            width: 100%;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            background-color: #0f172a;
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
        }

        input:focus, select:focus {
            border-color: var(--accent);
        }

        /* Relógio 3 Fusos */
        .clocks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-top: 1rem;
        }

        .clock-card {
            background-color: #0f172a;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            text-align: center;
        }

        .time-display {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--accent);
            font-family: monospace;
        }

        .date-display {
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        /* Calculadora de Voo */
        .flight-stops {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin: 1.5rem 0;
        }

        .stop-row {
            display: flex;
            gap: 0.75rem;
            align-items: center;
        }

        .btn {
            background-color: var(--accent);
            color: #0f172a;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: background-color 0.2s;
            width: auto;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        .btn-danger {
            background-color: #ef4444;
            color: white;
        }

        .btn-danger:hover {
            background-color: #dc2626;
        }

        .actions {
            display: flex;
            gap: 1rem;
        }

        .result-box {
            margin-top: 1.5rem;
            padding: 1rem;
            background-color: #0f172a;
            border-radius: 8px;
            border-left: 4px solid var(--accent);
            display: none;
        }

        /* Auto-complete / Datalist */
        datalist {
            background-color: var(--card-bg);
        }
    </style>
</head>
<body>

<div class="container">

    <!-- Busca Global -->
    <div class="card">
        <h2>Pesquisa de Capitais</h2>
        <div class="search-box" style="margin-top: 1rem;">
            <input type="text" id="globalSearch" list="capitalsList" placeholder="Digite uma capital ou país para verificar os dados...">
        </div>
        <div id="searchResult" style="margin-top: 1rem; color: var(--text-muted);"></div>
    </div>

    <!-- Relógio de 3 Fusos -->
    <div class="card">
        <h2>Relógio Mundial (3 Fusos Horários)</h2>
        <div class="clocks-grid">
            <!-- Relógio 1 -->
            <div class="clock-card">
                <select id="selectZone1" onchange="updateClocks()"></select>
                <div class="time-display" id="time1">00:00:00</div>
                <div class="date-display" id="date1">--/--/----</div>
            </div>
            <!-- Relógio 2 -->
            <div class="clock-card">
                <select id="selectZone2" onchange="updateClocks()"></select>
                <div class="time-display" id="time2">00:00:00</div>
                <div class="date-display" id="date2">--/--/----</div>
            </div>
            <!-- Relógio 3 -->
            <div class="clock-card">
                <select id="selectZone3" onchange="updateClocks()"></select>
                <div class="time-display" id="time3">00:00:00</div>
                <div class="date-display" id="date3">--/--/----</div>
            </div>
        </div>
    </div>

    <!-- Calculadora de Distância de Voo -->
    <div class="card">
        <h2>Calculadora de Distância de Voo</h2>
        <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 0.25rem;">
            Selecione a origem, destino e adicione quantas escalas desejar.
        </p>

        <div class="flight-stops" id="stopsContainer">
            <div class="stop-row">
                <select class="flight-select"><option value="">Selecione a Origem</option></select>
            </div>
            <div class="stop-row">
                <select class="flight-select"><option value="">Selecione o Destino Final</option></select>
            </div>
        </div>

        <div class="actions">
            <button class="btn" onclick="addStop()">+ Adicionar Escala</button>
            <button class="btn" onclick="calculateDistance()">Calcular Rota</button>
        </div>

        <div class="result-box" id="flightResult"></div>
    </div>

</div>

<!-- Data List para Busca rápida -->
<datalist id="capitalsList"></datalist>

// Inicialização de Dados no DOM
document.addEventListener('DOMContentLoaded', () => {
    populateLists();
    setupClockSelects();
    updateClocks();
    setInterval(updateClocks, 1000);
});

// Preenche listas de seleção e busca
function populateLists() {
    const dataList = document.getElementById('capitalsList');
    const selects = document.querySelectorAll('.flight-select');

    database.sort((a,b) => a.capital.localeCompare(b.capital)).forEach((item, index) => {
        // Popula Datalist para a busca
        const option = document.createElement('option');
        option.value = `${item.capital} (${item.country})`;
        dataList.appendChild(option);

        // Popula os selects da calculadora de voo
        selects.forEach(select => {
            const opt = document.createElement('option');
            opt.value = index;
            opt.textContent = `${item.capital} - ${item.country}`;
            select.appendChild(opt);
        });
    });
}

// Configura os fusos iniciais
function setupClockSelects() {
    const sel1 = document.getElementById('selectZone1');
    const sel2 = document.getElementById('selectZone2');
    const sel3 = document.getElementById('selectZone3');

    database.forEach((item, idx) => {
        const opt1 = new Option(`${item.capital} (${item.country})`, item.tz);
        const opt2 = new Option(`${item.capital} (${item.country})`, item.tz);
        const opt3 = new Option(`${item.capital} (${item.country})`, item.tz);

        sel1.add(opt1);
        sel2.add(opt2);
        sel3.add(opt3);
    });

    // Padrões: Brasília (Brasil), Londres (Reino Unido), Tóquio (Japão)
    sel1.value = "America/Sao_Paulo";
    sel2.value = "Europe/London";
    sel3.value = "Asia/Tokyo";
}

// Atualiza o relógio digital em tempo real
function updateClocks() {
    for (let i = 1; i <= 3; i++) {
        const tz = document.getElementById(`selectZone${i}`).value;
        const now = new Date();

        try {
            const timeFormatter = new Intl.DateTimeFormat('pt-BR', {
                timeZone: tz,
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: false
            });

            const dateFormatter = new Intl.DateTimeFormat('pt-BR', {
                timeZone: tz,
                weekday: 'short',
                day: '2-digit',
                month: '2-digit',
                year: 'numeric'
            });

            document.getElementById(`time${i}`).textContent = timeFormatter.format(now);
            document.getElementById(`date${i}`).textContent = dateFormatter.format(now);
        } catch (e) {
            document.getElementById(`time${i}`).textContent = "--:--:--";
        }
    }
}

// Mecanismo de Busca
document.getElementById('globalSearch').addEventListener('input', (e) => {
    const val = e.target.value.toLowerCase();
    const resultDiv = document.getElementById('searchResult');
    
    if(!val) {
        resultDiv.innerHTML = '';
        return;
    }

    const found = database.find(item => 
        item.capital.toLowerCase().includes(val) || 
        item.country.toLowerCase().includes(val)
    );

    if (found) {
        resultDiv.innerHTML = `
            <strong style="color:var(--text-main);">${found.capital}</strong>, ${found.country}<br>
            Fuso Horário IANA: <code>${found.tz}</code> | Coordenadas: ${found.lat}, ${found.lon}
        `;
    } else {
        resultDiv.innerHTML = 'Nenhuma capital ou país encontrado.';
    }
});

// Adicionar escala na calculadora de voo
function addStop() {
    const container = document.getElementById('stopsContainer');
    const rows = container.getElementsByClassName('stop-row');
    
    // Cria novo select
    const newRow = document.createElement('div');
    newRow.className = 'stop-row';

    const select = document.createElement('select');
    select.className = 'flight-select';
    select.innerHTML = '<option value="">Selecione a Escala</option>';

    database.forEach((item, index) => {
        const opt = document.createElement('option');
        opt.value = index;
        opt.textContent = `${item.capital} - ${item.country}`;
        select.appendChild(opt);
    });

    const removeBtn = document.createElement('button');
    removeBtn.className = 'btn btn-danger';
    removeBtn.textContent = 'X';
    removeBtn.onclick = () => newRow.remove();

    newRow.appendChild(select);
    newRow.appendChild(removeBtn);

    // Insere antes do destino final
    container.insertBefore(newRow, rows[rows.length - 1]);
}

// Cálculo geodésico (Fórmula de Haversine)
function calculateDistance() {
    const selects = document.querySelectorAll('.flight-select');
    const points = [];

    selects.forEach(select => {
        if(select.value !== "") {
            points.push(database[select.value]);
        }
    });

    if (points.length < 2) {
        alert("Por favor, selecione ao menos uma origem e um destino final.");
        return;
    }

    let totalKm = 0;
    let routeSummary = "";

    for (let i = 0; i < points.length - 1; i++) {
        const p1 = points[i];
        const p2 = points[i+1];
        const dist = haversineDistance(p1.lat, p1.lon, p2.lat, p2.lon);
        totalKm += dist;

        const legName = i === 0 ? "Origem" : `Escala ${i}`;
        const nextLegName = i + 1 === points.length - 1 ? "Destino" : `Escala ${i+1}`;
        
        routeSummary += `<br>• ${p1.capital} → ${p2.capital}: <strong>${Math.round(dist).toLocaleString('pt-BR')} km</strong>`;
    }

    const totalNauticalMiles = totalKm * 0.539957;
    const estFlightHours = totalKm / 800; // Média estimada de 800 km/h para avião comercial

    const resultBox = document.getElementById('flightResult');
    resultBox.style.display = 'block';
    resultBox.innerHTML = `
        <h3>Resumo da Rota</h3>
        ${routeSummary}
        <hr style="border-color: var(--border); margin: 0.75rem 0;">
        <p><strong>Distância Total:</strong> ${Math.round(totalKm).toLocaleString('pt-BR')} km (${Math.round(totalNauticalMiles).toLocaleString('pt-BR')} NM)</p>
        <p><strong>Tempo Estimado de Voo Direto:</strong> ~${Math.floor(estFlightHours)}h ${Math.round((estFlightHours % 1) * 60)}min (sem contar conexões/ventos)</p>
    `;
}

function haversineDistance(lat1, lon1, lat2, lon2) {
    const R = 6371; // Raio da Terra em KM
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = 
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
        Math.sin(dLon / 2) * Math.sin(dLon / 2);
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    return R * c;
}
