<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Fusos Horários e Calculadora de Voo Completa</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121214;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .btn-principal {
            background-color: #4ea8de;
            color: #121214;
            border: none;
            padding: 15px 35px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(78, 168, 222, 0.3);
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn-principal:hover {
            background-color: #3a8dbd;
            transform: scale(1.02);
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 9999;
        }

        .modal-box {
            width: 1200px;
            max-width: 95vw;
            background-color: #1a1a1e;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            border: 1px solid #3a3a42;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            position: relative;
            transform: scale(0.9);
            transition: transform 0.3s ease;
            max-height: 95vh;
            overflow-y: auto;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-overlay.active .modal-box {
            transform: scale(1);
        }

        .close-btn {
            position: absolute;
            top: 12px;
            right: 15px;
            background: #ff5f56;
            border: none;
            color: white;
            font-weight: bold;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .search-box {
            display: flex;
            align-items: center;
            gap: 8px;
            background-color: #26262b;
            padding: 6px 12px;
            border-radius: 5px;
            border: 1px solid #3a3a42;
            flex-grow: 1;
            max-width: 400px;
        }

        .search-box input {
            background: transparent;
            border: none;
            color: white;
            outline: none;
            width: 100%;
            font-size: 0.88rem;
        }

        .selectors { display: flex; gap: 10px; flex-wrap: wrap; }
        select {
            background-color: #333339;
            color: white;
            border: 1px solid #555;
            padding: 6px 12px;
            border-radius: 5px;
            font-size: 0.85rem;
            cursor: pointer;
            outline: none;
            max-width: 260px;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: #26262b;
        }
        th, td {
            border: 1px solid #3a3a42;
            text-align: center;
            padding: 7px 2px;
            font-size: 0.8rem;
        }
        th { background-color: #1f1f23; font-weight: 600; }
        .city-header {
            text-align: left;
            padding-left: 8px;
            width: 220px;
            font-weight: bold;
            background-color: #18181c;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .legend { 
            display: flex; 
            gap: 20px; 
            font-size: 0.78rem; 
            background: #26262b;
            padding: 6px 15px;
            border-radius: 6px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .legend-item { display: flex; align-items: center; gap: 6px; }
        .color-box { width: 12px; height: 12px; border-radius: 3px; }

        .p-amanhecer { background-color: #d4a373; color: #000; font-weight: bold; }
        .p-manha     { background-color: #64b5f6; color: #000; font-weight: bold; }
        .p-dia       { background-color: #e9c46a; color: #000; font-weight: bold; }
        .p-anoitecer { background-color: #f4a261; color: #000; font-weight: bold; }
        .p-noite     { background-color: #1d3557; color: #fff; }

        .calc-section {
            background-color: #222227;
            border: 1px solid #3a3a42;
            border-radius: 8px;
            padding: 15px;
            margin-top: 5px;
        }
        .calc-title {
            font-size: 0.95rem;
            font-weight: bold;
            color: #4ea8de;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .calc-controls {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }
        .calc-results {
            margin-top: 12px;
            display: flex;
            gap: 20px;
            background-color: #18181c;
            padding: 10px 15px;
            border-radius: 6px;
            font-size: 0.88rem;
            flex-wrap: wrap;
        }
        .calc-results span { color: #4ea8de; font-weight: bold; }
        
        .escalas-wrapper {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 8px;
            width: 100%;
        }

        .escala-row {
            display: flex;
            align-items: center;
            gap: 10px;
            background-color: #1c1c20;
            padding: 6px 10px;
            border-radius: 5px;
            border: 1px solid #3a3a42;
        }

        .btn-add-escala {
            background-color: #2a9d8f;
            color: white;
            border: none;
            padding: 6px 12px;
            font-size: 0.82rem;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-add-escala:hover { background-color: #238276; }

        .btn-remove-escala {
            background-color: #e76f51;
            color: white;
            border: none;
            padding: 4px 8px;
            font-size: 0.75rem;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn-remove-escala:hover { background-color: #d05335; }
    </style>
</head>
<body>

    <button class="btn-principal" onclick="toggleModal(true)">Abrir Tabela & Calculadora de Voo</button>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box">
            <button class="close-btn" onclick="toggleModal(false)">X</button>
            
            <div class="top-bar">
                <div class="selectors">
                    <select id="sel-0" onchange="alterarFuso(0, this.value)"></select>
                    <select id="sel-1" onchange="alterarFuso(1, this.value)"></select>
                    <select id="sel-2" onchange="alterarFuso(2, this.value)"></select>
                </div>

                <!-- Barra de Pesquisa -->
                <div class="search-box">
                    🔍 <input type="text" id="search-input" placeholder="Pesquisar capital ou país..." oninput="filtrarCapitais()">
                </div>
            </div>

            <table>

                <tbody id="table-body"></tbody>
            </table>

            <div class="legend">

                <div class="legend-item"><div class="color-box p-manha"></div> Manhã (07h-11h)</div>
                <div class="legend-item"><div class="color-box p-dia"></div> Dia (12h-16h)</div>
                <div class="legend-item"><div class="color-box p-anoitecer"></div> Anoitecer (17h-18h)</div>
                <div class="legend-item"><div class="color-box p-noite"></div> Noite / Madrugada (19h-04h)</div>
            </div>

            <!-- Calculadora de Distância e Tempo de Voo com Múltiplas Escalas -->
            <div class="calc-section">
                <div class="calc-title">✈️ Calculadora de Distância e Tempo de Voo com Escalas (Haversine)</div>
                <div class="calc-controls">
                    <label>Origem: <select id="calc-origem" onchange="calcularVoo()"></select></label>
                    <label>Destino: <select id="calc-destino" onchange="calcularVoo()"></select></label>
                    <button class="btn-add-escala" onclick="adicionarEscala()">+ Adicionar Escala</button>
                </div>

                <!-- Container Dinâmico de Escalas -->
                <div class="escalas-wrapper" id="escalas-container"></div>

                <div class="calc-results">
                    <div>Distância Total: <span id="res-distancia">0 km</span></div>
                    <div>Tempo Estimado de Voo: <span id="res-tempo">0h 0min</span></div>
                    <div>Diferença de Fuso (Origem/Destino): <span id="res-fuso">0h</span></div>
                </div>
            </div>
        </div>
    </div>

        // Ordenar alfabeticamente
        capitaisMundo.sort((a, b) => a.name.localeCompare(b.name));

        let indicesAtivos = [
            capitaisMundo.findIndex(c => c.name.startsWith("Brasília")),
            capitaisMundo.findIndex(c => c.name.startsWith("Lisboa")),
            capitaisMundo.findIndex(c => c.name.startsWith("Tóquio"))
        ];

        let escalasList = [];

        function toggleModal(open) {
            const overlay = document.getElementById('modalOverlay');
            if (open) overlay.classList.add('active');
            else overlay.classList.remove('active');
        }

        function obterClassePeriodo(hora) {
            if (hora >= 5 && hora <= 6) return 'p-amanhecer';
            if (hora >= 7 && hora <= 11) return 'p-manha';
            if (hora >= 12 && hora <= 16) return 'p-dia';
            if (hora >= 17 && hora <= 18) return 'p-anoitecer';
            return 'p-noite'; 
        }

        function preencherSeletor(selectElem, valorSelecionado, filtro = "") {
            const prevVal = selectElem.value || valorSelecionado;
            selectElem.innerHTML = '';
            
            capitaisMundo.forEach((capital, index) => {
                if (!filtro || capital.name.toLowerCase().includes(filtro.toLowerCase())) {
                    const opt = document.createElement('option');
                    opt.value = index;
                    const fusoStr = capital.offset >= 0 ? `+${capital.offset}` : capital.offset;
                    opt.textContent = `${capital.name} (UTC ${fusoStr})`;
                    selectElem.appendChild(opt);
                }
            });

            if ([...selectElem.options].some(o => o.value == prevVal)) {
                selectElem.value = prevVal;
            } else if (selectElem.options.length > 0) {
                selectElem.selectedIndex = 0;
            }
        }

        function inicializarSeletores() {
            for (let i = 0; i < 3; i++) {
                const select = document.getElementById(`sel-${i}`);
                preencherSeletor(select, indicesAtivos[i]);
            }

            const selOrigem = document.getElementById('calc-origem');
            const selDestino = document.getElementById('calc-destino');

            preencherSeletor(selOrigem, indicesAtivos[0]);
            preencherSeletor(selDestino, indicesAtivos[2]);
            
            calcularVoo();
        }

        function filtrarCapitais() {
            const filtro = document.getElementById('search-input').value.trim();
            for (let i = 0; i < 3; i++) {
                const select = document.getElementById(`sel-${i}`);
                preencherSeletor(select, indicesAtivos[i], filtro);
                if (select.value !== "") {
                    indicesAtivos[i] = parseInt(select.value, 10);
                }
            }

            preencherSeletor(document.getElementById('calc-origem'), document.getElementById('calc-origem').value, filtro);
            preencherSeletor(document.getElementById('calc-destino'), document.getElementById('calc-destino').value, filtro);
            
            renderizarEscalas();
            renderizarRegua();
            calcularVoo();
        }

        function alterarFuso(seletorIdx, capitalIndex) {
            indicesAtivos[seletorIdx] = parseInt(capitalIndex, 10);
            renderizarRegua();
        }

        function renderizarRegua() {
            const headerRow = document.getElementById('header-row');
            const tbody = document.getElementById('table-body');
            
            headerRow.innerHTML = '<th class="city-header">Capital Base</th>';
            tbody.innerHTML = '';

            if (indicesAtivos.length === 0 || indicesAtivos[0] < 0) return;

            const capitalReferencia = capitaisMundo[indicesAtivos[0]];
            const fusoReferencia = capitalReferencia ? capitalReferencia.offset : 0;

            for (let i = 0; i < 24; i++) {
                const th = document.createElement('th');
                th.textContent = i.toString().padStart(2, '0');
                headerRow.appendChild(th);
            }

            indicesAtivos.forEach((capIdx) => {
                if (capIdx < 0 || !capitaisMundo[capIdx]) return;
                const capitalAtual = capitaisMundo[capIdx];
                const fusoAtual = capitalAtual.offset;
                
                const tr = document.createElement('tr');
                const tdNome = document.createElement('td');
                tdNome.className = 'city-header';
                tdNome.innerHTML = `<strong>${capitalAtual.name.split(' (')[0]}</strong>`;
                tr.appendChild(tdNome);

                for (let i = 0; i < 24; i++) {
                    const diferenca = fusoAtual - fusoReferencia;
                    let horaCalculada = (i + diferenca) % 24;
                    if (horaCalculada < 0) horaCalculada += 24; 

                    const horaInteira = Math.floor(horaCalculada);
                    const minutos = Math.round((horaCalculada - horaInteira) * 60);
                    
                    const tdHora = document.createElement('td');
                    tdHora.textContent = minutos > 0 
                        ? `${horaInteira.toString().padStart(2, '0')}:${minutos.toString().padStart(2, '0')}`
                        : horaInteira.toString().padStart(2, '0');

                    tdHora.className = obterClassePeriodo(horaInteira);
                    tr.appendChild(tdHora);
                }
                tbody.appendChild(tr);
            });
        }

        function adicionarEscala() {
            const indexPadrao = capitaisMundo.findIndex(c => c.name.startsWith("Paris"));
            escalasList.push({
                index: indexPadrao >= 0 ? indexPadrao : 0,
                espera: 2
            });
            renderizarEscalas();
            calcularVoo();
        }

        function removerEscala(idx) {
            escalasList.splice(idx, 1);
            renderizarEscalas();
            calcularVoo();
        }

        function atualizarEscala(idx, field, val) {
            if (field === 'index') escalasList[idx].index = parseInt(val, 10);
            if (field === 'espera') escalasList[idx].espera = parseFloat(val);
            calcularVoo();
        }

        function renderizarEscalas() {
            const container = document.getElementById('escalas-container');
            const filtro = document.getElementById('search-input').value.trim();
            container.innerHTML = '';

            escalasList.forEach((escala, idx) => {
                const row = document.createElement('div');
                row.className = 'escala-row';

                const lbl = document.createElement('span');
                lbl.style.fontSize = '0.85rem';
                lbl.style.fontWeight = 'bold';
                lbl.style.color = '#e76f51';
                lbl.textContent = `Escala ${idx + 1}:`;

                const sel = document.createElement('select');
                preencherSeletor(sel, escala.index, filtro);
                sel.value = escala.index;
                sel.onchange = (e) => atualizarEscala(idx, 'index', e.target.value);

                const lblTempo = document.createElement('span');
                lblTempo.style.fontSize = '0.82rem';
                lblTempo.textContent = 'Espera:';

                const selTempo = document.createElement('select');
                [1, 2, 3, 4, 5, 6, 8, 10, 12].forEach(h => {
                    const opt = document.createElement('option');
                    opt.value = h;
                    opt.textContent = `${h}h`;
                    if (h === escala.espera) opt.selected = true;
                    selTempo.appendChild(opt);
                });
                selTempo.onchange = (e) => atualizarEscala(idx, 'espera', e.target.value);

                const btnRemover = document.createElement('button');
                btnRemover.className = 'btn-remove-escala';
                btnRemover.textContent = 'Remover';
                btnRemover.onclick = () => removerEscala(idx);

                row.appendChild(lbl);
                row.appendChild(sel);
                row.appendChild(lblTempo);
                row.appendChild(selTempo);
                row.appendChild(btnRemover);

                container.appendChild(row);
            });
        }

        function haversine(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon / 2) * Math.sin(dLon / 2);
                      
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c;
        }

        function calcularVoo() {
            const idxO = parseInt(document.getElementById('calc-origem').value, 10);
            const idxD = parseInt(document.getElementById('calc-destino').value, 10);

            if (isNaN(idxO) || isNaN(idxD) || !capitaisMundo[idxO] || !capitaisMundo[idxD]) return;
            
            const orig = capitaisMundo[idxO];
            const dest = capitaisMundo[idxD];

            let PONTOS = [orig];
            let tempoEsperaTotal = 0;

            escalasList.forEach(e => {
                if (capitaisMundo[e.index]) {
                    PONTOS.push(capitaisMundo[e.index]);
                    tempoEsperaTotal += e.espera;
                }
            });

            PONTOS.push(dest);

            let distanciaTotal = 0;
            let tempoVooHoras = 0;

            for (let i = 0; i < PONTOS.length - 1; i++) {
                const distTrecho = haversine(PONTOS[i].lat, PONTOS[i].lon, PONTOS[i+1].lat, PONTOS[i+1].lon);
                distanciaTotal += distTrecho;
                if (distTrecho > 0) {
                    tempoVooHoras += (distTrecho / 850) + 0.5; // Velocidade média + taxiamento/decolagem
                }
            }

            const horasDecimais = tempoVooHoras + tempoEsperaTotal;
            const horas = Math.floor(horasDecimais);
            const minutos = Math.round((horasDecimais - horas) * 60);

            const difFuso = dest.offset - orig.offset;
            const fusoStr = difFuso >= 0 ? `+${difFuso}h` : `${difFuso}h`;

            document.getElementById('res-distancia').textContent = `${Math.round(distanciaTotal).toLocaleString('pt-BR')} km`;
            document.getElementById('res-tempo').textContent = `${horas}h ${minutos}min`;
            document.getElementById('res-fuso').textContent = fusoStr;
        }

        inicializarSeletores();
        renderizarRegua();
    </script>
