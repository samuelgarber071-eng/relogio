<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Global Compacto</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Tahoma, Verdana, Arial, sans-serif;
            font-size: 11px;
        }

        body {
            background-color: #d4d0c8;
            color: #000000;
            padding: 10px;
            display: flex;
            justify-content: center;
        }

        .app {
            width: 100%;
            max-width: 680px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* Header Simples */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 8px;
            background: #000080;
            color: #ffffff;
            border: 2px outset #ffffff;
        }

        .header h1 {
            font-size: 12px;
            font-weight: bold;
            color: #ffffff;
            letter-spacing: 0;
        }

        .search-wrap {
            position: relative;
            flex: 1;
            max-width: 240px;
        }

        input, select, button {
            background: #ffffff;
            color: #000000;
            border: 2px inset #ffffff;
            padding: 2px 4px;
            height: 22px;
            outline: none;
            border-radius: 0;
        }

        input { width: 100%; }

        .search-results {
            position: absolute;
            top: 24px;
            left: 0;
            right: 0;
            background: #ffffff;
            border: 2px solid #000000;
            max-height: 150px;
            overflow-y: auto;
            z-index: 100;
            display: none;
        }

        .search-item {
            padding: 3px 6px;
            cursor: pointer;
            border-bottom: 1px solid #d4d0c8;
            display: flex;
            justify-content: space-between;
        }

        .search-item:hover {
            background: #000080;
            color: #ffffff;
        }

        /* Clocks */
        .grid-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
        }

        .clock-box {
            background: #ece9d8;
            border: 2px outset #ffffff;
            padding: 6px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            text-align: center;
        }

        .clock-box select {
            width: 100%;
            font-size: 11px;
            text-overflow: ellipsis;
        }

        .time {
            font-family: "Courier New", Courier, monospace;
            font-size: 18px;
            font-weight: bold;
            color: #000080;
            background: #ffffff;
            border: 1px solid #808080;
            padding: 2px 0;
        }

        .date {
            font-size: 10px;
            color: #404040;
        }

        /* Flight Calc */
        .card {
            background: #ece9d8;
            border: 2px outset #ffffff;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .card-title {
            font-size: 11px;
            font-weight: bold;
            color: #000080;
            border-bottom: 1px solid #808080;
            padding-bottom: 2px;
            text-transform: uppercase;
        }

        .stops-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .stop-row {
            display: flex;
            gap: 4px;
            align-items: center;
        }

        .stop-row label {
            width: 60px;
            font-size: 11px;
            color: #000000;
            font-weight: normal;
        }

        .stop-row select {
            flex: 1;
        }

        .btn {
            cursor: pointer;
            font-weight: bold;
            background: #d4d0c8;
            color: #000000;
            border: 2px outset #ffffff;
            padding: 0 8px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 2px;
            border-radius: 0;
        }

        .btn:active {
            border-style: inset;
        }

        .btn-sm {
            height: 22px;
            font-size: 11px;
        }

        .btn-del {
            background: #d4d0c8;
            color: #c00000;
            width: 22px;
            padding: 0;
            flex-shrink: 0;
            font-weight: bold;
        }

        .actions {
            display: flex;
            gap: 4px;
            margin-top: 2px;
        }

        .result-panel {
            background: #ffffff;
            border: 2px inset #ffffff;
            padding: 6px;
            display: none;
            font-size: 11px;
            margin-top: 4px;
        }

        .result-panel .total {
            font-weight: bold;
            color: #000080;
            font-size: 11px;
        }

        @media (max-width: 550px) {
            .grid-3 { grid-template-columns: 1fr; }
            .header { flex-direction: column; gap: 4px; align-items: stretch; }
            .search-wrap { max-width: 100%; }
        }
    </style>
</head>
<body>

<div class="app">

    <!-- Header Compacto com Busca -->
    <div class="header">
        <h1>Painel Global</h1>
        <div class="search-wrap">
            <input type="text" id="searchInput" placeholder="Buscar capital ou país..." autocomplete="off">
            <div class="search-results" id="searchResults"></div>
        </div>
    </div>

    <!-- 3 Relógios de Fusos -->
    <div class="grid-3">
        <div class="clock-box">
            <select id="tz1" onchange="updateClocks()"></select>
            <div class="time" id="t1">00:00:00</div>
            <div class="date" id="d1">--/--/----</div>
        </div>
        <div class="clock-box">
            <select id="tz2" onchange="updateClocks()"></select>
            <div class="time" id="t2">00:00:00</div>
            <div class="date" id="d2">--/--/----</div>
        </div>
        <div class="clock-box">
            <select id="tz3" onchange="updateClocks()"></select>
            <div class="time" id="t3">00:00:00</div>
            <div class="date" id="d3">--/--/----</div>
        </div>
    </div>

    <!-- Calculadora de Distância de Voo -->
    <div class="card">
        <div class="card-title">Calculadora de Voo & Escalas</div>
        
        <div class="stops-list" id="stopsList">
            <div class="stop-row" id="rowOrigin">
                <label>Origem:</label>
                <select class="flight-select"><option value="">Selecione...</option></select>
            </div>
            <div class="stop-row" id="rowDestination">
                <label>Destino:</label>
                <select class="flight-select"><option value="">Selecione...</option></select>
            </div>
        </div>

        <div class="actions">
            <button class="btn btn-sm" onclick="addStop()">+ Escala</button>
            <button class="btn btn-sm" onclick="calculateRoute()" style="flex:1;">Calcular Rota</button>
        </div>

        <div class="result-panel" id="resultPanel"></div>
    </div>

</div>

// Sort db
db.sort((a,b) => a.k.localeCompare(b.k));

document.addEventListener('DOMContentLoaded', () => {
    initSelects();
    updateClocks();
    setInterval(updateClocks, 1000);
});

function initSelects() {
    const tz1 = document.getElementById('tz1');
    const tz2 = document.getElementById('tz2');
    const tz3 = document.getElementById('tz3');
    
    db.forEach((item) => {
        const text = `${item.k} (${item.c})`;
        tz1.add(new Option(text, item.tz));
        tz2.add(new Option(text, item.tz));
        tz3.add(new Option(text, item.tz));
    });

    tz1.value = "America/Sao_Paulo";
    tz2.value = "Europe/London";
    tz3.value = "Asia/Tokyo";

    populateFlightSelects();
}

function populateFlightSelects() {
    document.querySelectorAll('.flight-select').forEach(sel => {
        if(sel.options.length <= 1) {
            db.forEach((item, idx) => {
                sel.add(new Option(`${item.k} - ${item.c}`, idx));
            });
        }
    });
}

function updateClocks() {
    [1,2,3].forEach(i => {
        const tz = document.getElementById(`tz${i}`).value;
        const now = new Date();
        try {
            const timeStr = new Intl.DateTimeFormat('pt-BR', { timeZone: tz, hour:'2-digit', minute:'2-digit', second:'2-digit', hour12: false }).format(now);
            const dateStr = new Intl.DateTimeFormat('pt-BR', { timeZone: tz, day:'2-digit', month:'2-digit', weekday:'short' }).format(now);
            document.getElementById(`t${i}`).textContent = timeStr;
            document.getElementById(`d${i}`).textContent = dateStr;
        } catch(e) {}
    });
}

// Search
const searchInput = document.getElementById('searchInput');
const searchResults = document.getElementById('searchResults');

searchInput.addEventListener('input', (e) => {
    const val = e.target.value.toLowerCase().trim();
    if(!val) { searchResults.style.display = 'none'; return; }

    const matches = db.filter(item => item.k.toLowerCase().includes(val) || item.c.toLowerCase().includes(val)).slice(0, 8);

    if(matches.length > 0) {
        searchResults.innerHTML = matches.map(m => `
            <div class="search-item" onclick="selectSearchResult('${m.tz}')">
                <span><strong>${m.k}</strong>, ${m.c}</span>
                <span style="color:#555555; font-size:10px;">${m.tz.split('/')[1] || ''}</span>
            </div>
        `).join('');
        searchResults.style.display = 'block';
    } else {
        searchResults.style.display = 'none';
    }
});

document.addEventListener('click', (e) => {
    if(!searchInput.contains(e.target) && !searchResults.contains(e.target)) {
        searchResults.style.display = 'none';
    }
});

function selectSearchResult(tz) {
    document.getElementById('tz1').value = tz;
    updateClocks();
    searchResults.style.display = 'none';
    searchInput.value = '';
}

// Flight Stops
function addStop() {
    const list = document.getElementById('stopsList');
    const destRow = document.getElementById('rowDestination');
    const stops = list.querySelectorAll('.stop-row-escala');
    
    const row = document.createElement('div');
    row.className = 'stop-row stop-row-escala';

    row.innerHTML = `
        <label>Escala ${stops.length + 1}:</label>
        <select class="flight-select"><option value="">Selecione...</option></select>
        <button class="btn btn-sm btn-del" onclick="removeStop(this)">X</button>
    `;

    list.insertBefore(row, destRow);
    populateFlightSelects();
}

function removeStop(btn) {
    btn.parentElement.remove();
    document.querySelectorAll('.stop-row-escala').forEach((row, idx) => {
        row.querySelector('label').textContent = `Escala ${idx + 1}:`;
    });
}

function calculateRoute() {
    const selects = document.querySelectorAll('.flight-select');
    const points = [];

    selects.forEach(s => {
        if(s.value !== "") points.push(db[s.value]);
    });

    if(points.length < 2) {
        alert("Selecione origem e destino!");
        return;
    }

    let totalKm = 0;
    let details = [];

    for(let i=0; i<points.length-1; i++) {
        const p1 = points[i], p2 = points[i+1];
        const dist = haversine(p1.lat, p1.lon, p2.lat, p2.lon);
        totalKm += dist;
        details.push(`${p1.k} -> ${p2.k}: ${Math.round(dist)} km`);
    }

    const totalHours = totalKm / 800;
    const h = Math.floor(totalHours);
    const m = Math.round((totalHours - h) * 60);

    const panel = document.getElementById('resultPanel');
    panel.style.display = 'block';
    panel.innerHTML = `
        <div class="total">Distância Total: ${Math.round(totalKm).toLocaleString('pt-BR')} km (${Math.round(totalKm * 0.539957).toLocaleString('pt-BR')} NM)</div>
        <div style="margin-top:2px; color:#333333;">${details.join(' | ')}</div>
        <div style="font-size:11px; margin-top:2px;">Tempo est. voo: ~${h > 0 ? h + 'h ' : ''}${m}min</div>
    `;
}

function haversine(lat1, lon1, lat2, lon2) {
    const R = 6371;
    const dLat = (lat2-lat1)*Math.PI/180;
    const dLon = (lon2-lon1)*Math.PI/180;
    const a = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)*Math.sin(dLon/2);
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
