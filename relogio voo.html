<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Fusos Horários - Capitais do Mundo</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121214;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        .btn-principal {
            background-color: #4ea8de;
            color: #121214;
            border: none;
            padding: 15px 35px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(78, 168, 222, 0.3);
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn-principal:hover {
            background-color: #3a8dbd;
            transform: scale(1.02);
        }

        /* Fundo escurecido do Pop-up Virtual */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 9999;
        }

        /* Estrutura do Pop-up em Proporção 12x3 (1200x330) */
        .modal-box {
            width: 1200px;
            height: 330px;
            background-color: #1a1a1e;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            border: 1px solid #3a3a42;
            padding: 10px 15px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-overlay.active .modal-box {
            transform: scale(1);
        }

        .close-btn {
            position: absolute;
            top: 8px;
            right: 12px;
            background: #ff5f56;
            border: none;
            color: white;
            font-weight: bold;
            border-radius: 50%;
            width: 22px;
            height: 22px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
        }

        /* Área do Calculador de Voo */
        .flight-calc-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            background-color: #26262b;
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid #333339;
            font-size: 0.8rem;
        }

        .flight-calc-bar span {
            color: #4ea8de;
            font-weight: bold;
        }

        .flight-select {
            background-color: #1a1a1e;
            color: #fff;
            border: 1px solid #555;
            padding: 3px 6px;
            border-radius: 4px;
            font-size: 0.75rem;
            outline: none;
            max-width: 200px;
        }

        .calc-result {
            margin-left: auto;
            background: #18181c;
            padding: 3px 10px;
            border-radius: 4px;
            border: 1px solid #4ea8de;
            color: #e9c46a;
            font-weight: bold;
        }

        /* Área de Seleção e Busca no Topo */
        .top-bar {
            display: flex;
            justify-content: flex-start;
            margin-bottom: 2px;
        }
        .selectors { display: flex; gap: 15px; }
        .search-group {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        
        .input-busca {
            background-color: #26262b;
            color: #4ea8de;
            border: 1px solid #444;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.72rem;
            outline: none;
            width: 280px;
        }
        .input-busca::placeholder { color: #888; }
        .input-busca:focus { border-color: #4ea8de; }

        select.sel-fuso {
            background-color: #333339;
            color: white;
            border: 1px solid #555;
            padding: 3px 6px;
            border-radius: 4px;
            font-size: 0.78rem;
            cursor: pointer;
            outline: none;
            width: 280px;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: #26262b;
        }
        th, td {
            border: 1px solid #3a3a42;
            text-align: center;
            padding: 5px 2px;
            font-size: 0.78rem;
        }
        th { background-color: #1f1f23; font-weight: 600; }
        .city-header {
            text-align: left;
            padding-left: 8px;
            width: 220px;
            font-weight: bold;
            background-color: #18181c;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        /* Legenda */
        .legend { 
            display: flex; 
            gap: 20px; 
            font-size: 0.75rem; 
            background: #26262b;
            padding: 4px 15px;
            border-radius: 6px;
            justify-content: center;
        }
        .legend-item { display: flex; align-items: center; gap: 6px; }
        .color-box { width: 12px; height: 12px; border-radius: 3px; }

        /* Cores */
        .p-amanhecer { background-color: #d4a373; color: #000; font-weight: bold; }
        .p-manha     { background-color: #64b5f6; color: #000; font-weight: bold; }
        .p-dia       { background-color: #e9c46a; color: #000; font-weight: bold; }
        .p-anoitecer { background-color: #f4a261; color: #000; font-weight: bold; }
        .p-noite     { background-color: #1d3557; color: #fff; }
    </style>
</head>
<body>

    <button class="btn-principal" onclick="toggleModal(true)">Abrir Tabela de Capitais (12x3)</button>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box">
            <button class="close-btn" onclick="toggleModal(false)">X</button>

            <!-- BARRA DE CÁLCULO DE VOO REAL -->
            <div class="flight-calc-bar">
                <span>✈️ Calculador de Voo Real:</span>
                <label>De:</label>
                <select id="flight-origem" class="flight-select" onchange="calcularTempoVoo()"></select>
                <label>Para:</label>
                <select id="flight-destino" class="flight-select" onchange="calcularTempoVoo()"></select>
                <div class="calc-result" id="flight-resultado">Distância: 0 km | Tempo estimado: 0h 0m</div>
            </div>
            
            <!-- SELETORES E PESQUISA -->
            <div class="top-bar">
                <div class="selectors">
                    <div class="search-group">
                        <input type="text" class="input-busca" placeholder="🔍 Pesquisar Capital 1..." oninput="filtrarOpcoes(0, this.value)">
                        <select id="sel-0" class="sel-fuso" onchange="alterarFuso(0, this.value)"></select>
                    </div>

                    <div class="search-group">
                        <input type="text" class="input-busca" placeholder="🔍 Pesquisar Capital 2..." oninput="filtrarOpcoes(1, this.value)">
                        <select id="sel-1" class="sel-fuso" onchange="alterarFuso(1, this.value)"></select>
                    </div>

                    <div class="search-group">
                        <input type="text" class="input-busca" placeholder="🔍 Pesquisar Capital 3..." oninput="filtrarOpcoes(2, this.value)">
                        <select id="sel-2" class="sel-fuso" onchange="alterarFuso(2, this.value)"></select>
                    </div>
                </div>
            </div>

            <!-- REGUA DE FUSOS -->
            <table>
                <thead><tr id="header-row"><th class="city-header">Capital Base</th></tr></thead>
                <tbody id="table-body"></tbody>
            </table>

            <!-- LEGENDA -->
            <div class="legend">
                <div class="legend-item"><div class="color-box p-amanhecer"></div> Amanhecer (05h-06h)</div>
                <div class="legend-item"><div class="color-box p-manha"></div> Manhã (07h-11h)</div>
                <div class="legend-item"><div class="color-box p-dia"></div> Dia (12h-16h)</div>
                <div class="legend-item"><div class="color-box p-anoitecer"></div> Anoitecer (17h-18h)</div>
                <div class="legend-item"><div class="color-box p-noite"></div> Noite / Madrugada (19h-04h)</div>
            </div>
        </div>
    </div>

    <script>
        // Banco com Coordenadas Geográficas Reais (Lat, Lon) das Capitais
        const capitaisMundo = [
            { name: "Brasília (Brasil)", offset: -3, lat: -15.793889, lon: -47.882778 },
            { name: "Lisboa (Portugal)", offset: 0, lat: 38.716667, lon: -9.133333 },
            { name: "Tóquio (Japão)", offset: 9, lat: 35.689722, lon: 139.692222 },
            { name: "Washington, D.C. (Estados Unidos)", offset: -5, lat: 38.8951, lon: -77.0364 },
            { name: "Londres (Reino Unido)", offset: 0, lat: 51.507222, lon: -0.1275 },
            { name: "Paris (França)", offset: 1, lat: 48.856614, lon: 2.352222 },
            { name: "Berlim (Alemanha)", offset: 1, lat: 52.52, lon: 13.405 },
            { name: "Roma (Itália)", offset: 1, lat: 41.902782, lon: 12.496366 },
            { name: "Madri (Espanha)", offset: 1, lat: 40.416775, lon: -3.703790 },
            { name: "Buenos Aires (Argentina)", offset: -3, lat: -34.603722, lon: -58.381592 },
            { name: "Santiago (Chile)", offset: -4, lat: -33.448890, lon: -70.669265 },
            { name: "Bogotá (Colômbia)", offset: -5, lat: 4.710989, lon: -74.072092 },
            { name: "Cidade do México (México)", offset: -6, lat: 19.432608, lon: -99.133208 },
            { name: "Pequim (China)", offset: 8, lat: 39.9042, lon: 116.4074 },
            { name: "Camberra (Austrália)", offset: 10, lat: -35.2809, lon: 149.1300 },
            { name: "Moscou (Rússia)", offset: 3, lat: 55.7558, lon: 37.6173 },
            { name: "Pretória (África do Sul)", offset: 2, lat: -25.747867, lon: 28.229271 },
            { name: "Cairo (Egito)", offset: 2, lat: 30.0444, lon: 31.2357 },
            { name: "Nova Déli (Índia)", offset: 5.5, lat: 28.6139, lon: 77.2090 },
            { name: "Ottawa (Canadá)", offset: -5, lat: 45.4215, lon: -75.6972 },
            { name: "Montevidéu (Uruguai)", offset: -3, lat: -34.9011, lon: -56.1645 },
            { name: "Lima (Peru)", offset: -5, lat: -12.0464, lon: -77.0428 },
            { name: "Cingapura (Cingapura)", offset: 8, lat: 1.3521, lon: 103.8198 },
            { name: "Bangcoc (Tailândia)", offset: 7, lat: 13.7563, lon: 100.5018 },
            { name: "Seul (Coreia do Sul)", offset: 9, lat: 37.5665, lon: 126.9780 },
            { name: "Wellington (Nova Zelândia)", offset: 12, lat: -41.2865, lon: 174.7762 },
            { name: "Caracas (Venezuela)", offset: -4, lat: 10.4806, lon: -66.9036 },
            { name: "Quito (Equador)", offset: -5, lat: -0.1807, lon: -78.4678 },
            { name: "Assunção (Paraguai)", offset: -4, lat: -25.2637, lon: -57.5759 },
            { name: "La Paz (Bolívia)", offset: -4, lat: -16.4897, lon: -68.1193 }
        ];

        let cidadesAtivas = [-3, 0, 9]; 

        function toggleModal(open) {
            const overlay = document.getElementById('modalOverlay');
            if (open) overlay.classList.add('active');
            else overlay.classList.remove('active');
        }

        // Fórmula Haversine para Distância Ortodrômica Real (em km)
        function calcularDistanciaHaversine(lat1, lon1, lat2, lon2) {
            const R = 6371; // Raio da Terra em km
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = 
                Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c; 
        }

        // Cálculo do tempo de voo com velocidade de cruzeiro comercial
        function calcularTempoVoo() {
            const indexOrigem = document.getElementById('flight-origem').value;
            const indexDestino = document.getElementById('flight-destino').value;

            const cOrigem = capitaisMundo[indexOrigem];
            const cDestino = capitaisMundo[indexDestino];

            if (!cOrigem || !cDestino) return;

            if (indexOrigem === indexDestino) {
                document.getElementById('flight-resultado').innerHTML = `Distância: 0 km | Tempo estimado: 0h 0m`;
                return;
            }

            const distanciaKm = calcularDistanciaHaversine(cOrigem.lat, cOrigem.lon, cDestino.lat, cDestino.lon);
            
            // Velocidade média comercial de cruzeiro (~850 km/h) + 0.5h para táxi/decolagem/pouso
            const velocidadeKmh = 850;
            const horasTotais = (distanciaKm / velocidadeKmh) + 0.5;

            const horas = Math.floor(horasTotais);
            const minutos = Math.round((horasTotais - horas) * 60);

            document.getElementById('flight-resultado').innerHTML = 
                `Distância: <strong>${Math.round(distanciaKm).toLocaleString('pt-BR')} km</strong> | Tempo Estimado de Voo: <strong>${horas}h ${minutos}m</strong>`;
        }

        function popularSelectFlight() {
            const selOrigem = document.getElementById('flight-origem');
            const selDestino = document.getElementById('flight-destino');
            
            selOrigem.innerHTML = '';
            selDestino.innerHTML = '';

            capitaisMundo.forEach((capital, index) => {
                const opt1 = document.createElement('option');
                opt1.value = index;
                opt1.textContent = capital.name.split(' (')[0];

                const opt2 = document.createElement('option');
                opt2.value = index;
                opt2.textContent = capital.name.split(' (')[0];

                selOrigem.appendChild(opt1);
                selDestino.appendChild(opt2);
            });

            // Padrão: Brasília -> Lisboa
            selOrigem.selectedIndex = 0;
            selDestino.selectedIndex = 1;
            calcularTempoVoo();
        }

        function obterClassePeriodo(hora) {
            if (hora >= 5 && hora <= 6) return 'p-amanhecer';
            if (hora >= 7 && hora <= 11) return 'p-manha';
            if (hora >= 12 && hora <= 16) return 'p-dia';
            if (hora >= 17 && hora <= 18) return 'p-anoitecer';
            return 'p-noite'; 
        }

        function popularSelect(index, termoBusca = "") {
            const select = document.getElementById(`sel-${index}`);
            const valorAtual = cidadesAtivas[index];
            select.innerHTML = '';

            const listaFiltrada = capitaisMundo.filter(c => 
                c.name.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "")
                .includes(termoBusca.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, ""))
            );

            if (listaFiltrada.length === 0) {
                const opt = document.createElement('option');
                opt.textContent = "Nenhum resultado encontrado";
                select.appendChild(opt);
                return;
            }

            listaFiltrada.forEach(capital => {
                const opt = document.createElement('option');
                opt.value = capital.offset;
                const fusoStr = capital.offset >= 0 ? `+${capital.offset}` : capital.offset;
                opt.textContent = `${capital.name} (UTC ${fusoStr})`;
                
                if (capital.offset === valorAtual) {
                    opt.selected = true;
                }
                select.appendChild(opt);
            });
        }

        function filtrarOpcoes(index, termo) {
            popularSelect(index, termo);
            const select = document.getElementById(`sel-${index}`);
            if (select.options.length > 0 && select.value) {
                alterarFuso(index, select.value);
            }
        }

        function inicializarSeletores() {
            for (let i = 0; i < 3; i++) {
                popularSelect(i);
            }
            popularSelectFlight();
        }

        function alterarFuso(index, offsetValue) {
            cidadesAtivas[index] = parseFloat(offsetValue);
            renderizarRegua();
        }

        function renderizarRegua() {
            const headerRow = document.getElementById('header-row');
            const tbody = document.getElementById('table-body');
            
            headerRow.innerHTML = '<th class="city-header">Capital Base</th>';
            tbody.innerHTML = '';

            const fusoReferencia = cidadesAtivas[0];

            for (let i = 0; i < 24; i++) {
                const th = document.createElement('th');
                th.textContent = i.toString().padStart(2, '0');
                headerRow.appendChild(th);
            }

            cidadesAtivas.forEach((fusoAtual, idx) => {
                const tr = document.createElement('tr');
                const selectElem = document.getElementById(`sel-${idx}`);
                const optionSelecionada = selectElem.options[selectElem.selectedIndex];
                
                const tdNome = document.createElement('td');
                tdNome.className = 'city-header';
                const textoNome = optionSelecionada ? optionSelecionada.textContent.split(' (')[0] : "—";
                tdNome.innerHTML = `<strong>${textoNome}</strong>`;
                tr.appendChild(tdNome);

                for (let i = 0; i < 24; i++) {
                    const diferenca = fusoAtual - fusoReferencia;
                    let horaCalculada = (i + diferenca) % 24;
                    if (horaCalculada < 0) horaCalculada += 24; 

                    const tdHora = document.createElement('td');
                    
                    const horaInteira = Math.floor(horaCalculada);
                    const minutos = Math.round((horaCalculada - horaInteira) * 60);
                    
                    tdHora.textContent = minutos > 0 
                        ? `${horaInteira.toString().padStart(2, '0')}:${minutos}`
                        : horaInteira.toString().padStart(2, '0');

                    tdHora.className = obterClassePeriodo(horaInteira);
                    tr.appendChild(tdHora);
                }
                tbody.appendChild(tr);
            });
        }

        inicializarSeletores();
        renderizarRegua();
    </script>
</body>
</html>
